<div class="dropdown-custom">
  <div class="d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center flex-1">
      <input
        [disabled]="disabled"
        class="form-check-input"
        type="checkbox"
        [(ngModel)]="selected"
        (change)="handleDropdown()" />
      <div (click)="handleDropdown()" class="flex-1">
        <label class="col-form-label ml-2" for="{{ name }}">{{ label }}</label>
      </div>
    </div>
    <i class="fa-solid fa-angle-down pt-1" *ngIf="dropdown"></i>
    <i class="fa-solid fa-angle-up pt-1" *ngIf="!dropdown"></i>
  </div>
  <div class="pb-3" *ngIf="dropdown">
    <ng-content></ng-content>
  </div>
</div>
