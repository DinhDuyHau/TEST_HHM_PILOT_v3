<div class="custom-dropdown" #selectSearch>
    <div class="dropdown-header" (click)="toggleDropdown()">
        <i class="fa-solid fa-bars"></i>
        <span>{{ selectedStore?.label || '' }}</span>
        <i class="fa fa-angle-down" [ngClass]="{'open': dropdownOpen}"></i>
    </div>
    <div class="dropdown-options" [hidden]="!dropdownOpen">
        <div class="search-container">
            <input class="search" type="text" [(ngModel)]="searchText" (input)="filterItems()">
            <i class="fas fa-search"></i>
        </div>
        <div class="store" *ngFor="let store of data" (click)="selectStore(store)">
            {{ store?.label }}
        </div>
    </div>
</div>
