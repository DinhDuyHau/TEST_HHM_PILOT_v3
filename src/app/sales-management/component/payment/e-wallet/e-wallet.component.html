<div class="search-dialog-container">
  <div class="search-dialog-wrapper px-2">
    <div class="title mb-3">Danh sách ví điện tử</div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
      <form-payment-custom
        [readonly]="readonly"
        class="flex-1"
        [name]="'thong_tin'"
        [label]="'Thông tin ví'"
        [value]="vi_dien_tu.thong_tin"
        [invalid]="invalid"
        [disabled]="true"
        (handleChangeValue)="vi_dien_tu.thong_tin = $event"
        (handleClickOpenDialog)="onOpenSearchWallet()" />
      <form-payment-custom
        [readonly]="readonly"
        class="flex-1"
        [name]="'so_hd_vnpay'"
        [label]="'Số hoá đơn'"
        [value]="vi_dien_tu.so_hd_vnpay"
        [invalid]="invalid"
        [disabled]="readonly"
        (handleChangeValue)="vi_dien_tu.so_hd_vnpay = $event" />
      <form-payment-custom
        id="vidt_so_tien"
        [readonly]="readonly"
        class="flex-1"
        label="Số tiền"
        [value]="vi_dien_tu.tien"
        dataType="number"
        format="moneyInputFormat"
        [align]="'right'"
        [invalid]="invalid"
        [disabled]="readonly"
        (handleChangeValue)="vi_dien_tu.tien = $event"
        (handleEnterInput)="addDetail()" />
    </div>
    <div class="search-dialog pt-2">
      <div class="py-1 text-base font-semibold">Chi tiết</div>
      <table-custom
        [isLoading]="isLoading"
        [type]="'search-dialog'"
        [dataSource]="dataSource"
        [columns]="columns"
        [totalItem]="recordCount"
        [size]="page_size"
        [isTicket]="false"
        [readonly]="readonly"
        (handleDelete)="onDeleteItem($event)"></table-custom>
    </div>

    <div class="d-flex justify-end gap-2 px-3">
      <div class="btn-responsive btn-cancel" (click)="onCancel()">Đóng</div>
      <!-- <div class="btn-responsive btn-add" (click)="onSave()">Chọn</div> -->
    </div>
    <div class="close-btn" (click)="onCancel()">
      <i class="fas fa-times"></i>
    </div>
  </div>
</div>
