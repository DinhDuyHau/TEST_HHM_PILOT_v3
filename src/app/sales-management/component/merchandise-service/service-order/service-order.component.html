<div class="service-for-imei-container">
  <div class="title mt-4 mb-4 fs-4">{{ title }}</div>
  <div>
    <table-custom
      [dataSource]="dataSource"
      [dataSourceAll]="filteredData"
      [columns]="columns"
      [selectByCheckbox]="true"
      [selectByCheckboxAll]="true"
      (handleChangeSelectCheckbox)="onItemSelected($event)" />
  </div>
  <div mat-dialog-actions class="d-flex justify-end gap-2 m-2">
    <div class="btn-responsive btn-cancel" (click)="onCancel()">Hủy bỏ</div>
    <div class="btn-responsive btn-add" (click)="onSelect()">Chọn</div>
  </div>
  <div class="close-btn" (click)="onCancel()">
    <i class="fas fa-times"></i>
  </div>
</div>
