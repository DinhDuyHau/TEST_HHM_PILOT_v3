<div class="service-for-imei-container">
    <div class="title">Cập nhật thông tin hàng thu cũ</div>
    <div>
      <div>
        <div class="box-container">
          <form-input-custom
            class="box"
            label="Imei"
            [disabled]="true"
            [value]="currentItem.ma_imei"
             />
          <form-input-custom
             class="box"
             label="Mã loại"
             [disabled]="true"
             [value]="currentItem.ma_loai"
              />
        </div>
      </div>
      <div>
        <div class="box-container">
          <form-input-custom
            class="box"
            label="Mã vật tư"
            [disabled]="true"
            [readonly]="true"
            [value]="currentItem.ma_vt" />
  
          <form-input-custom
            class="box"
            label="Tên vật tư"
            [disabled]="true"
            [readonly]="true"
            [value]="currentItem.ten_vt"
             />
        </div>
      </div>
      <div>
        <div class="box-container">
          <form-input-custom
            class="box"
            label="Giá chương trình thu cũ"
            [disabled]="true"
            [value]="currentItem.gia0" 
            dataType="number"
            [readonly]="true"
            [align]="'end'"
            format="moneyViewFormat"/>
  
          <form-input-custom
            class="box"
            label="Giá bán"
            [disabled]="true"
            [readonly]="true"
            [value]="currentItem.gia_ban"
            dataType="number"
            [align]="'end'"
            format="moneyViewFormat"
             />
        </div>
      </div>
      <div>
        <div class="box-container">
          <form-input-custom
            class="box"
            label="Giá điều chỉnh"
            [value]="gia_dc" 
            dataType="number"
            [align]="'end'"
            format="moneyInputFormat"
            (handleChangeValue)="changePrice($event)"
            />
        </div>
      </div>
  
      <hr />
    </div>
    <div mat-dialog-actions class="d-flex justify-end gap-2 m-2">
      <div class="btn-responsive btn-cancel" (click)="onCancel()">Hủy bỏ</div>
      <div class="btn-responsive btn-add" (click)="onSave()">Cập nhật</div>
    </div>
    <div class="close-btn" (click)="onCancel()">
      <i class="fas fa-times"></i>
    </div>
</div>
