<div
  class="px-1 md:px-2 lg:px-4 flex-1 bg-white position-relative ticket-container">
  <div class="d-flex flex-column gap-2 mt-5 flex-1">
    <div class="title-page pb-2 flex justify-between items-center">
      <div class="flex">
        <h5 class="">{{ title }}</h5>
        <app-voucher-info-header
          [entity]="entity"
          [voucherId]="ticket.masterInfo.stt_rec"
        />
      </div>
      <app-navigation-voucher
        [mode]="this.mode"
        [voucherId]="this.ticket.masterInfo.stt_rec"
      />
    </div>
    <div class="title-content">{{ getLabel('tlt_content') }}</div>
    <div class="box-container mb-3">
      <div class="d-flex gap-2 box">
        <form-input-custom
          class="flex-1"
          [name]="'so_ct'"
          [label]="getLabel('lbl_so_ct')"
          [value]="ticket.masterInfo.so_ct"
          [disabled]="true" />
        <form-input-custom
          class="flex-1"
          [name]="'ngay_ct'"
          [label]="getLabel('lbl_ngay_ct')"
          [value]="ticket.masterInfo.ngay_ct"
          format="datetimeFormat"
          dataType="date"
          [disabled]="true" />
      </div>

      <form-input-custom
        class="box"
        [name]="'ma_kh'"
        [label]="getLabel('lbl_ma_kh')"
        [value]="ticket.masterInfo.ma_kh"
        [invalid]="invalid"
        [readonly]="readonly"
        [invalid]="invalidMerchandiseInput.ma_kh"
        (handleChangeValue)="onEnterCustomerCode($event)"
        (handleClickOpenDialog)="openSearchCustomerDialog()"
        (handleUploadImage)="openUploadImage()"
        (handleUViewPhoto)="openImage()" />
      <form-input-custom
        class="box"
        [name]="'ten_kh'"
        [label]="getLabel('lbl_ten_kh')"
        [value]="ticket.masterInfo.ten_kh"
        [disabled]="true" />
      <form-select-custom
        class="box"
        [isDisable]="readonly || disableSelectStatus"
        [label]="getLabel('lbl_trang_thai')"
        [options]="statusList"
        optionDes="statusname"
        optionValue="status"
        [value]="ticket.masterInfo.status"
        (handleChangeValue)="ticket.masterInfo.status = $event" />
      <form-input-custom
        class="box"
        [name]="'dia_chi'"
        [label]="getLabel('lbl_dia_chi')"
        [value]="ticket.masterInfo.dia_chi"
        [disabled]="true" />
      <form-input-custom
        class="box"
        [name]="'ghi_chu'"
        [label]="getLabel('lbl_ghi_chu')"
        [readonly]="readonly"
        [value]="ticket.masterInfo.dien_giai"
        (handleChangeValue)="ticket.masterInfo.dien_giai = $event" />
      <form-select-custom
        class="box order-dynamic-1 width-full"
        [isDisable]="readonly || this.mode !== 0 || this.ticket.merchandise.length > 0"
        [label]="'Loại giao dịch'"
        [options]="transactionTypeOptions"
        optionDes="label"
        optionValue="value"
        [value]="ticket.masterInfo.fcode1"
        (handleChangeValue)="onChangeTransactionType($event)" />
      <form-input-custom
        class="box"
        [name]="'loai_hh'"
        [label]="'Nhóm hàng hóa'"
        [disabled]="readonly || ticket.masterInfo.fcode1 == '3'"
        [readonly]="true"
        [invalid]="invalidMerchandiseInput.loai_hh"
        *ngIf="!readonly"
        [value]="repurchase.loai_hh"
        (handleClickOpenDialog)="openSearchTypeMerchandiseDialog()" />
      <div class="d-flex gap-2 box">&nbsp;</div>
      <div class="d-flex gap-2 box" *ngIf="ticket.masterInfo.fcode1 != '3'">
        <form-select-custom
          *ngIf="ticket.masterInfo.fcode1 == '2'"
          class="flex-1"
          [isDisable]="readonly || this.mode !== 0"
          [label]="'Thuế suất(%)'"
          [options]="thuesuatOptions"
          optionDes="label"
          optionValue="value"
          [value]="ticket.masterInfo.fqty1"
          (handleChangeValue)="onChangeThueSuat($event)" />
        <form-input-custom
          class="flex-1"
          [label]="'Giá nhập mua (Full VAT)'"
          name="gia_nhap_mua"
          [align]="'end'"
          [value]="ticket.masterInfo.gia_nhap_mua"
          [invalid]="invalidMerchandiseInput.gia_nhap_mua"
          *ngIf="!readonly"
          dataType="number"
          (handleChangeValue)="onEnterPrice($event)"
          format="moneyInputFormat" />
      </div>
      <form-input-custom
        class="box"
        [label]="getLabel('lbl_imei')"
        name="imei"
        *ngIf="!readonly && ticket.masterInfo.fcode1 != '3'"
        (handleEnterInput)="onEnterImeiCode($event)"
        [uploadImage]="true" />
      <form-input-custom
        class="box"
        name="ma_vt"
        [label]="getLabel('lbl_ma_vt')"
        [value]="repurchase.ma_vt"
        [invalid]="invalidMerchandiseInput.ma_vt"
        *ngIf="!readonly && ticket.masterInfo.fcode1 != '3'"
        [disabled]="readonly"
        (handleClickOpenDialog)="openTypeMerchandiseDialog()"
        (handleEnterInput)="onEnterMerchandiseCode($event)" />

      <!-- 3.MUA THU CŨ KHÔNG LÊN ĐỜI -->
      <div class="box" *ngIf="ticket.masterInfo.fcode1 == '3' && !readonly">
        <form-input-custom
          class=""
          [name]="'imei_used'"
          [label]="getLabel('lbl_imei')"
          [disabled]="readonly"
          [value]="renew.ma_imei"
          [fireChangeWhenBlur]="false"
          (handleChangeValue)="onChangeImei($event)"
          (handleEnterInput)="onChangeImei($event)"
          [uploadImage]="true" />

        <div class="flex flex-1 gap-2">
          <form-input-custom
            class="basis-2/5"
            name="ma_vt"
            [label]="getLabel('lbl_ma_vt_nhap')"
            [isLookup]="true"
            [controller]="'dmvt'"
            [value]="renew.ma_vt"
            [invalid]="invalidMerchandiseInput.ma_vt"
            [disabled]="!isValidItemOld"
            [readonly]="true"
            (handleClickOpenDialog)="openTypeMerchandiseDialog()" />
          <form-input-custom
            class="flex-1"
            name="ten_vt"
            #ten_vt_mua
            [label]="getLabel('lbl_ten_vt')"
            [value]="renew.ten_vt"
            [disabled]="true" />
        </div>

        <div class="flex flex-1 gap-2">
          <form-input-custom
            class="basis-2/5"
            [name]="'loai_hh'"
            [label]="getLabel('lbl_loai_hh')"
            [value]="renew.loai_hh"
            [readonly]="true"
            [disabled]="readonly"
            [invalid]="invalidMerchandiseInput.loai_hh"
            (handleClickOpenDialog)="openSearchTypeMerchandiseDialog3()" />
          <form-input-custom
            class="basis-3/5"
            [name]="'gia_nhap_mua'"
            [label]="'Giá theo bảng giá'"
            [align]="'end'"
            [value]="renew.gia_nt"
            [disabled]="readonly"
            dataType="number"
            [readonly]="true"
            format="moneyViewFormat" />
        </div>

        <div class="flex flex-1 gap-2">
          <form-input-custom
            class="basis-2/5"
            [name]="'loai_hh'"
            [label]="getLabel('lbl_ma_ncc_tc')"
            [value]="renew.ma_ncc"
            [readonly]="true"
            [disabled]="true" />
          <div class="flex flex-1">
            <form-input-custom
              class="basis-3/5"
              [name]="'gia_mua'"
              [label]="'Giá mua'"
              [align]="'end'"
              [value]="renew.gia_mua"
              [disabled]="readonly"
              dataType="number"
              format="moneyViewFormat"
              (handleChangeValue)="onChangeBuyPrice($event)" />
            <button
              style="margin-top: 32px; height: 38px; margin-left: 12px;"
              class="flex-1 btn act-input-data-btn text-nowrap"
              (click)="updateRepurchaseOld()">
              Cập nhật
            </button>
          </div>
        </div>
      </div>

      <div class="d-flex box align-items-end gap-3 mt-3 align-self-end">
        <button
          *ngIf="!readonly"
          class="flex-1 btn act-input-data-btn text-nowrap"
          (click)="openAddCustomerDialog()">
          {{ getLabel('lbl_add_customer') }}
        </button>
      </div>
    </div>

    <tabs-custom title="Thông tin hàng hóa">
      <tab-custom label="Hàng hoá" class="w-100">
        <table-custom
          [readonly]="readonly"
          [dataSource]="ticket.merchandise"
          [columns]="merchandiseColumns"
          (handleDelete)="onRemoveMerchandise($event)" />
      </tab-custom>
      <tab-custom label="Thuế đầu vào" class="w-100">
        <!-- <div
          class="text-medium font-medium flex flex-1 border-b-0.5 border-dashed border-neutrals07_color">
          {{ getLabel('lbl_tt_xuat_hddt') }}
        </div>
        <e-invoice-info
          [data]="ticket.masterInfo"
          [disabled]="readonly"></e-invoice-info>
        <div
          class="text-medium font-medium flex flex-1 border-b-0.5 border-dashed border-neutrals07_color pt-1 md:pt-3 lg:pt-7">
          {{ getLabel('lbl_hddt_phat_hanh') }}
        </div>
        <e-invoice-tab [data]="eInvoiceInfo"></e-invoice-tab> -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-1 lg:gap-x-10 gap-y-1 lg:gap-y-3 pt-0.5 md:pt-1 lg:pt-2">
          <form-input-custom
            class="flex-1"
            [label]="'Số hóa đơn'"
            [value]="ticket.masterInfo.so_ct0"
            [disabled]="readonly"
            (handleChangeValue)="ticket.masterInfo.so_ct0 = $event"></form-input-custom>
          <form-input-custom
            class="flex-1"
            [label]="'Ký hiệu'"
            [value]="ticket.masterInfo.so_seri0"
            [disabled]="readonly"
            (handleChangeValue)="ticket.masterInfo.so_seri0 = $event"></form-input-custom>
          <app-input-custom-v2
            [label]="'Ngày hóa đơn'"
            class="flex-1"
            type="date"
            name="ngay_ct0"
            type="date"
            [value]="ticket.masterInfo.ngay_ct0"
            [dataFormatString]="'datetimeFormat'"
            (handleChange)="ticket.masterInfo.ngay_ct0 = $event"></app-input-custom-v2>
          <form-input-custom
            class="flex-1"
            [label]="'Mã số thuế'"
            [value]="ticket.masterInfo.hd_mst && ticket.masterInfo.hd_mst.trim()"
            [disabled]="readonly"
            (handleChangeValue)="
              ticket.masterInfo.hd_mst = $event; handleChangeTaxCode($event)
            "></form-input-custom>
          <form-input-custom
            class="flex-1"
            [label]="'Email'"
            [value]="ticket.masterInfo.hd_email"
            [disabled]="readonly"
            (handleChangeValue)="ticket.masterInfo.hd_email = $event"></form-input-custom>
          <form-input-custom
            class="flex-1"
            [label]="'Tên khách hàng'"
            [value]="ticket.masterInfo.hd_ten_kh"
            [disabled]="readonly"
            (handleChangeValue)="ticket.masterInfo.hd_ten_kh = $event"></form-input-custom>
          <form-input-custom
            class="flex-1"
            [label]="'Địa chỉ'"
            [value]="ticket.masterInfo.hd_dia_chi"
            [disabled]="readonly"
            (handleChangeValue)="ticket.masterInfo.hd_dia_chi = $event"></form-input-custom>
        </div>
      </tab-custom>
    </tabs-custom>
    <ng-container>
      <payment-tab
        [action]="action"
        [shop]="shop"
        [invalid]="invalid"
        [readonly]="readonly"
        [pay_hidden]="[
          'tien_dat_coc',
          'quet_the',
          'vi_dien_tu',
          'vnpay',
          'tra_gop',
          'sd_diem',
          'ma_giam_gia',
          'chuyen_khoan',
          'chiet_khau',
          'giam_gia_crm',
          'voucher_doi_tac',
          'quet_the_tra_gop'
        ]"
        [hiddenChooseButton]="mode === 2"
        [isPaymentHH]="false"
        [t_tong_tien]="ticket.masterInfo.t_tt_nt"
        [data]="ticket.payment"
        [t_con_no]="ticket.masterInfo.t_con_no"
        [t_da_tra]="ticket.masterInfo.t_da_tra"
        (handleChangeValue)="
          ticket.masterInfo.t_con_no = $event.t_con_no;
          ticket.masterInfo.t_da_tra = $event.t_da_tra
        " />
    </ng-container>
    <div>
      <div class="title-content p-2">{{ getLabel('lbl_tc_don_hang') }}</div>
      <div class="box-container">
        <div class="box d-flex gap-2">
          <form-input-custom
            class="flex-1"
            [disabled]="true"
            [label]="getLabel('lbl_so_luong')"
            [align]="'end'"
            [value]="ticket.masterInfo.t_so_luong" />

          <form-input-custom
            class="flex-1"
            [disabled]="true"
            [align]="'end'"
            [label]="'Tổng tiền'"
            [value]="ticket.masterInfo.t_tt_nt"
            format="moneyViewFormat"
            dataType="number" />
        </div>
        <!-- <form-input-custom
          class="box"
          [disabled]="true"
          [label]="getLabel('lbl_diem_qd')"
          [align]="'end'"
          [value]="ticket.masterInfo.diem_qd"
          format="moneyViewFormat"
          dataType="number" /> -->
      </div>
      <div class="d-flex justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.ticket.masterInfo.stt_rec"
        />

        <div class="d-flex gap-2 ms-auto">
          <app-voucher-info
            *ngIf="this.mode != 0"
            [entity]="entity"
            class="text-base"
            [voucherId]="ticket.masterInfo.stt_rec" />
          <div class="btn-responsive btn-in-file">
            <span>{{ getLabel('btnPrint') }}</span>
          </div>
          <div class="btn-responsive btn-cancel" (click)="onCancel()">
            {{ cancelButtonTitle }}
          </div>
          <button
            class="btn-responsive btn-add"
            [disabled]="isDisabled"
            (click)="onSave()"
            *ngIf="!readonly">
            {{ submitButtonTitle }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="isSaving"
    class="position-absolute start-0 top-0 opacity-50"
    style="width: 100%; height: 100%; background-color: rgb(193, 193, 193)">
    <div class="position-absolute top-50 start-50 translate-middle">
      <div class="d-flex flex-column">
        <div class="spinner-border text-dark align-self-center" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Đang lưu</p>
      </div>
    </div>
  </div>
</div>
