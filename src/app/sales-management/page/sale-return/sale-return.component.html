<div
  class="px-1 md:px-2 lg:px-4 flex-1 bg-white position-relative ticket-container">
  <div class="d-flex flex-column gap-2 mt-5 flex-1">
    <div class="title-page pb-2 flex justify-between items-center">
      <div class="flex">
        <h5 class="">{{ title }}</h5>
        <app-voucher-info-header
          [entity]="entity"
          [voucherId]="ticket.masterInfo.stt_rec"
        />
      </div>
      <app-navigation-voucher
        [mode]="this.mode"
        [voucherId]="this.ticket.masterInfo.stt_rec"
      />
    </div>
    <div class="title-content">{{ getLabel('tlt_content') }}</div>
    <div class="box-container mb-3">
      <div class="d-flex gap-2 box">
        <form-input-custom
          class="flex-1"
          [name]="'so_ct'"
          [label]="getLabel('lbl_so_ct')"
          [value]="ticket.masterInfo.so_ct"
          [disabled]="true" />
        <form-input-custom
          class="flex-1"
          [name]="'ngay_ct'"
          [label]="getLabel('lbl_ngay_ct')"
          [value]="ticket.masterInfo.ngay_ct"
          format="datetimeFormat"
          dataType="date"
          [disabled]="true" />
      </div>

      <form-input-custom
        class="box"
        [name]="'ma_kh'"
        [label]="getLabel('lbl_ma_kh')"
        [value]="ticket.masterInfo.ma_kh"
        [readonly]="readonly"
        [invalid]="invalid"
        [disabled]="true" />
      <form-input-custom
        class="box"
        [name]="'ten_kh'"
        [label]="getLabel('lbl_ten_kh')"
        [value]="ticket.masterInfo.ten_kh"
        [disabled]="true" />

      <form-select-custom
        class="box"
        [isDisable]="readonly || disableSelectStatus"
        [label]="getLabel('lbl_trang_thai')"
        [options]="statusList"
        optionDes="statusname"
        optionValue="status"
        [value]="ticket.masterInfo.status"
        (handleChangeValue)="ticket.masterInfo.status = $event" />

      <form-input-custom
        class="box"
        [name]="'dien_giai'"
        [label]="getLabel('lbl_dien_giai')"
        [value]="ticket.masterInfo.dien_giai"
        (handleChangeValue)="ticket.masterInfo.dien_giai = $event"
        [readonly]="readonly" />

      <form-input-custom
        class="box"
        [name]="'dia_chi'"
        [label]="getLabel('lbl_dia_chi')"
        [value]="ticket.masterInfo.dia_chi"
        [disabled]="true" />

      <form-select-custom
        class="box"
        [isDisable]="isDisableReturnType"
        [label]="'Loại giao dịch'"
        [options]="saleReturnType"
        optionDes="ten_loai"
        optionValue="ma_loai"
        [value]="ticket.masterInfo.fcode1"
        (handleChangeValue)="onSaleReturnTypeChange($event)" />
      <!-- ticket.masterInfo.fcode1 = $event -->

      <div class="d-flex gap-2 box">
        <mat-checkbox
          class="box flex items-end flex-1 justify-start"
          [(ngModel)]="isCODReturn"
          (change)="onCODReturn($event)"
          [disabled]="isDisableCODReturn"
          >Trả lại đơn COD</mat-checkbox>
      </div>

      <div class="d-flex gap-2 box">
        <mat-checkbox
          class="box flex items-end flex-1 justify-end"
          [(ngModel)]="isSaleDown"
          [disabled]="false"
          >{{ getLabel('giam_gia_db') }}</mat-checkbox
        >
      </div>

      <div class="d-flex gap-2 box">
        <form-input-custom
          class="flex-1"
          [name]="'so_ct_ban'"
          [label]="'Số phiếu bán'"
          [value]="ticket.masterInfo.fcode2"
          (handleChangeValue)="ticket.masterInfo.fcode2 = $event"
          [disabled]="true" />
        <form-input-custom
          class="flex-1"
          [name]="'ngay_ct_ban'"
          [label]="'Ngày phiếu bán'"
          [value]="ticket.masterInfo.fdate2"
          (handleChangeValue)="ticket.masterInfo.fdate2 = $event"
          format="datetimeFormat"
          dataType="date"
          [disabled]="true" />
      </div>

      <form-input-custom
        class="box"
        [name]="'imei'"
        [label]="getLabel('lbl_imei')"
        [readonly]="readonly"
        (handleEnterInput)="onEnterImeiCode($event)"
        (handleClickCodeScanner)="!readonly && onClickCodeScanner()"
        [uploadImage]="true" />

      <!-- <div class="d-flex gap-2 box">&nbsp;</div> -->
      <div class="d-flex gap-2 box">
        <form-input-custom
          *ngIf="isSaleDown"
          class="flex-1"
          [name]="'rate'"
          [label]="getLabel('lbl_ti_le_giam')"
          [disabled]="disable_tl_giam"
          [value]="rate"
          [align]="'end'"
          [invalid]="isSaleDown && invalid ? true : false"
          (handleChangeValue)="handleChangeRate($event)"
          [readonly]="readonly" />

        <form-input-custom
          *ngIf="isSaleDown"
          class="flex-1"
          [name]="'tien_giam'"
          [label]="getLabel('lbl_tien_giam')"
          [disabled]="disable_tien_giam"
          [value]="tien_giam"
          [align]="'end'"
          [dataType]="'number'"
          [format]="'moneyViewFormat3'"
          [invalid]="isSaleDown && invalid ? true : false"
          (handleChangeValue)="handleChangeTienGiam($event)"
          [readonly]="readonly" />
      </div>
      <div class="none md:flex md:gap-2 md:box md:w-1/4"></div>
      <div class="none lg:flex lg:gap-2 lg:box md:w-1/4"></div>
      <div class="d-flex gap-2 box">
        <form-input-custom
          *ngIf="isSaleDown"
          class="flex-1"
          [name]="'ma_asm'"
          [label]="getLabel('lbl_ma_asm')"
          [value]="ma_asm"
          [readonly]="readonly"
          [invalid]="invalid"
          (handleChangeValue)="onEnterASMCode($event)"
          (handleClickOpenDialog)="openSearchASMDialog()" />

        <form-input-custom
          *ngIf="isSaleDown"
          class="flex-1"
          [name]="'ten_asm'"
          [label]="getLabel('lbl_ten_asm')"
          [value]="ten_asm"
          [disabled]="true" />
      </div>
    </div>

    <tabs-custom title="Thông tin hàng hóa">
      <tab-custom label="Hàng hoá" class="w-100">
        <table-custom
          [readonly]="readonly"
          [dataSource]="ticket.merchandise"
          [columns]="merchandiseColumns"
          (handleDelete)="onRemoveMerchandise($event)" />
      </tab-custom>
      <tab-custom label="Dịch vụ" class="w-100">
        <table-custom
          [dataSource]="ticket.service"
          [columns]="serviceColumns"
          [readonly]="readonly"
          (handleDelete)="onRemoveService($event)" />
        <div class="flex gap-0 md:gap-4 lg:gap-8">
          <div class="flex-1 hidden lg:block"></div>
          <div class="flex-1 hidden md:block"></div>
          <div class="flex flex-1">
            <form-input-custom
              class="flex-1"
              name="email"
              [label]="getLabel('lbl_email_key')"
              *ngIf="!readonly"
              [value]="ticket.masterInfo.email_nhan_key"
              [invalid]="invalid"
              (handleChangeValue)="ticket.masterInfo.email_nhan_key = $event" />
          </div>
        </div>
      </tab-custom>
      <tab-custom label="HĐĐT Bán hàng" class="w-100">
        <div class="box-container">
          <div class="box-2">
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_mau_hd'"
              [label]="getLabel('lbl_hddt_mau_hd')"
              [value]="ticket.electronic_bill.bh_mau_hd"
              [disabled]="true" />
            <form-input-custom
              [name]="'bh_ngay_hd'"
              [label]="getLabel('lbl_hddt_ngay_hd')"
              [value]="ticket.electronic_bill.bh_ngay_hd"
              dataType="date"
              type="date"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_so_hd'"
              [label]="getLabel('lbl_hddt_so_hd')"
              [value]="ticket.electronic_bill.bh_so_hd"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_ma_so_thue'"
              [label]="getLabel('lbl_hddt_ma_so_thue')"
              [value]="ticket.electronic_bill.bh_ma_so_thue"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_ma_tra_cuu'"
              [label]="getLabel('lbl_hddt_ma_tra_cuu')"
              [value]="ticket.electronic_bill.bh_ma_tra_cuu"
              [disabled]="true" />
          </div>
          <div class="box-2">
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_so_seri'"
              [label]="getLabel('lbl_hddt_so_seri')"
              [value]="ticket.electronic_bill.bh_so_seri"
              [disabled]="true" />
            <form-input-custom
              [name]="'bh_ngay_ky'"
              [label]="getLabel('lbl_hddt_ngay_ky')"
              [value]="ticket.electronic_bill.bh_ngay_ky"
              dataType="date"
              type="date"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_status'"
              [label]="getLabel('lbl_hddt_status')"
              [value]="ticket.electronic_bill.bh_status"
              [disabled]="true" />
          </div>
        </div>
      </tab-custom>
      <tab-custom label="HĐĐT Nhập trả lại" class="w-100">
        <div class="box-container">
          <div class="box-2">
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_mau_hd'"
              [label]="getLabel('lbl_hddt_mau_hd')"
              [value]="ticket.electronic_bill.tl_mau_hd"
              [disabled]="true" />
            <form-input-custom
              [name]="'bh_ngay_hd'"
              [label]="getLabel('lbl_hddt_ngay_hd')"
              [value]="ticket.electronic_bill.tl_ngay_hd"
              dataType="date"
              type="date"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_so_hd'"
              [label]="getLabel('lbl_hddt_so_hd')"
              [value]="ticket.electronic_bill.tl_so_hd"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_ma_so_thue'"
              [label]="getLabel('lbl_hddt_ma_so_thue')"
              [value]="ticket.electronic_bill.tl_ma_so_thue"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_ma_tra_cuu'"
              [label]="getLabel('lbl_hddt_ma_tra_cuu')"
              [value]="ticket.electronic_bill.tl_ma_tra_cuu"
              [disabled]="true" />
          </div>
          <div class="box-2">
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_so_seri'"
              [label]="getLabel('lbl_hddt_so_seri')"
              [value]="ticket.electronic_bill.tl_so_seri"
              [disabled]="true" />
            <form-input-custom
              [name]="'bh_ngay_ky'"
              [label]="getLabel('lbl_hddt_ngay_ky')"
              [value]="ticket.electronic_bill.tl_ngay_ky"
              dataType="date"
              type="date"
              [disabled]="true" />
            <form-input-custom
              [readonly]="readonly"
              [name]="'bh_status'"
              [label]="getLabel('lbl_hddt_status')"
              [value]="ticket.electronic_bill.bh_status"
              [disabled]="true" />
          </div>
        </div>
      </tab-custom>
    </tabs-custom>

    <ng-container>
        <payment-tab
        [action]="action"
        [shop]="shop"
        [invalid]="invalid"
        [readonly]="readonly"
        [pay_hidden]="[
          'tien_dat_coc',
          'quet_the',
          'vi_dien_tu',
          'vnpay',
          'tra_gop',
          'sd_diem',
          'ma_giam_gia',
          'chuyen_khoan',
          'chiet_khau',
          'giam_gia_crm',
          'voucher_doi_tac',
          'quet_the_tra_gop'
        ]"
        [hiddenChooseButton]="mode === 2"
        [isPaymentHH]="false"
        [t_tong_tien]="ticket.masterInfo.t_tt_nt"
        [data]="ticket.payment"
        [t_con_no]="ticket.masterInfo.t_con_no"
        [t_da_tra]="ticket.masterInfo.t_da_tra"
        (handleChangeValue)="
          ticket.masterInfo.t_con_no = $event.t_con_no;
          ticket.masterInfo.t_da_tra = $event.t_da_tra
        " />
   </ng-container>

    <div>
      <div class="title-content p-2">{{ getLabel('lbl_tc_don_hang') }}</div>
      <div class="box-container">
        <div class="box d-flex gap-2">
          <form-input-custom
            class="flex-1"
            [disabled]="true"
            [label]="getLabel('lbl_so_luong')"
            [align]="'end'"
            [value]="ticket.masterInfo.t_so_luong" />

          <form-input-custom
            class="flex-1"
            [disabled]="true"
            [align]="'end'"
            [label]="getLabel('lbl_thanh_tien')"
            [value]="ticket.masterInfo.t_tien_nt2"
            format="moneyViewFormat"
            dataType="number" />
        </div>
        <form-input-custom
          class="box"
          [disabled]="true"
          [label]="getLabel('lbl_thu_nhap_khac')"
          [align]="'end'"
          [value]="ticket.masterInfo.t_tien_tnk"
          format="moneyViewFormat"
          dataType="number" />
        <div class="box d-flex gap-2">
          <form-input-custom
            class="flex-1"
            [disabled]="true"
            [label]="getLabel('lbl_chiet_khau')"
            [align]="'end'"
            [value]="ticket.masterInfo.t_ck"
            format="moneyViewFormat"
            dataType="number" />
          <form-input-custom
            class="flex-1"
            [disabled]="true"
            [label]="getLabel('lbl_thue')"
            [align]="'end'"
            [value]="ticket.masterInfo.t_thue_nt"
            format="moneyViewFormat"
            dataType="number" />
        </div>
        <div class="box">&nbsp;</div>
        <div class="box">&nbsp;</div>
        <form-input-custom
          class="box"
          [disabled]="true"
          [label]="getLabel('lbl_t_tt')"
          [align]="'end'"
          [value]="ticket.masterInfo.t_tt_nt"
          format="moneyViewFormat"
          dataType="number" />
        <div class="w-100 order-10 d-flex justify-content-end">
          <form-input-custom
            class="box"
            [disabled]="true"
            [label]="getLabel('lbl_diem_qd')"
            [align]="'end'"
            [value]="ticket.masterInfo.diem_qd"
            format="moneyViewFormat"
            dataType="number" />
        </div>
      </div>
      <div class="flex w-100 justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.ticket.masterInfo.stt_rec"
        />
        <div class="d-flex gap-2 ms-auto">
          <app-voucher-info
            *ngIf="this.mode != 0"
            [entity]="entity"
            class="text-base"
            [voucherId]="ticket.masterInfo.stt_rec" />
          <div class="btn-responsive btn-in-file">
            <span>{{ getLabel('btnPrint') }}</span>
          </div>
          <div class="btn-responsive btn-cancel" (click)="onCancel()">
            {{ cancelButtonTitle }}
          </div>
          <button
            class="btn-responsive btn-add"
            [disabled]="isDisabled"
            (click)="onSave()"
            *ngIf="!readonly">
            {{ submitButtonTitle }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="isSaving"
    class="position-absolute start-0 top-0 opacity-50"
    style="width: 100%; height: 100%; background-color: rgb(193, 193, 193)">
    <div class="position-absolute top-50 start-50 translate-middle">
      <div class="d-flex flex-column">
        <div class="spinner-border text-dark align-self-center" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Đang lưu</p>
      </div>
    </div>
  </div>
</div>
