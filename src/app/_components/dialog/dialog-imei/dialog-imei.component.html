<div mat-dialog-actions class="flex flex-col h-full bg-white imei-dialog-container">
  <div class="w-full relative flex justify-between p-1">
    <div class="font-medium text-xl">
      IMEI của <span class="text-green-500">{{ data.ma_vt }}:</span>
    </div>
  </div>
  <div class="flex w-full p-2">
    <textarea #txtImeiInput
      (focus)="(true)"
      class="w-full px-1 outline-none border-0.5 border-solid border-primary01_color"
      name=""
      id=""
      [(ngModel)]="ma_imei"
      cols="30"
      rows="5"
      (keyup)="handleImeiInputKeyup($event, txtImeiInput.value)"
      ></textarea>
  </div>
  <div class="flex w-full px-2">&nbsp;
  </div>
  <div class="flex flex-1 w-full px-2">
    <div class="imei-table-wrap">
      <table class="body-wrap">
        <thead>
          <tr>
            <th style="width:70px;"><div>Stt</div></th>
            <th style="width:calc(100% - 140px);"><div>Imei</div></th>
            <th style="width:70px;"><div>&nbsp;</div></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let imei_item of imei_data; let i = index; let even = even; let odd = odd" 
              [ngClass]="{ odd: odd, even: even }">
            <td>{{ i + 1 }}</td>
            <td><span>{{ imei_item }}</span></td>
            <td>
              <button (click)="onDeleteItem(i)">
                <i class="fas fa-trash-alt icon-table text-danger"></i>
              </button>
            </td>
          </tr>        
        </tbody>
      </table>
    </div>
    
  </div>
  <div class="w-full relative flex justify-between px-2 pb-2 items-end" style="padding-top: 20px;">
    <div class="d-flex justify-end gap-2">
      <div class="btn-responsive btn-add" (click)="onClickSave()">Nhận</div>
      <div class="btn-responsive btn-cancel" (click)="onClickClose()">Hủy bỏ</div>
    </div>
    <div class="d-flex" style="margin-left: auto;">
      <div class="btn-responsive btn-cancel" (click)="onClearAll()">Xóa tất cả</div>
    </div>

  </div>
</div>
