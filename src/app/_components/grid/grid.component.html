<div class="p-2 grid_container" id="container" #container>
  <div class="flex flex-col py-1" #buttonRef>
    <span class="text-text_color text-large font-medium" *ngIf="titleGrid">{{
      titleGrid
    }}</span>
    <div class="flex py-1">
      <button
        *ngFor="let button of buttons"
        mat-flat-button
        extended
        (click)="onClickButton($event, button.id)"
        class="mr-2"
        [style.backgroundColor]="button.buttonColor">
        <mat-icon [style.color]="button.iconColor">{{ button.icon }}</mat-icon>
        <div
          class="text-medium font-normal"
          [ngStyle]="{color: button.iconColor}">
          {{ button.name }}
        </div>
      </button>
    </div>
  </div>
  <div #grid id="grid" class="mat-elevation-z8">
    <div class="table_header" #tblHeader>
      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        (matSortChange)="sortData($event)">
        <ng-container
          *ngFor="let column of fields; let indexColumn = index"
          [matColumnDef]="column.name"
          [sticky]="isSticky(column.name)">
          <!-- [resizeColumn]="!isSticky(column.name)"
            [index]="indexColumn" -->
          <th
            class="px-2 align-middle text-center header"
            mat-header-cell
            mat-sort-header
            [disabled]="!column.allowSorting ? true : false"
            *matHeaderCellDef
            [width]="column.width + 'px'">
            <span
              *ngIf="column.type !== 'select'"
              class="text-title font-normal"
              >{{ column.title }}
            </span>
            <span
              *ngIf="column.type === 'select'"
              (click)="onClickSelectColumn(indexColumn)"
              class="text-title font-normal hover:underline hover:cursor-pointer"
              >{{ column.title }}
            </span>
          </th>
          <!-- <td mat-cell *matCellDef="let element">{{ element[column] }}</td> -->
        </ng-container>

        <ng-container *ngIf="gridType != 2">
          <ng-container
            *ngFor="let column of fields; let indexColumn = index"
            [matColumnDef]="'search' + column.name"
            [sticky]="isSticky(column.name)">
            <th mat-header-cell *matHeaderCellDef class="px-0 align-middle">
              <div class="flex items-center px-1">
                <div class="pr-1">
                  <fa-icon
                    [icon]="['fas', 'search']"
                    size="lg"
                    class="text-tertiary_color"></fa-icon>
                </div>
                <input
                  tabIndex="-1"
                  [(ngModel)]="column.search"
                  (keypress)="onSearch($event)"
                  [disabled]="!column.allowFilter"
                  class="outline-none bg-transparent text-medium w-0 flex-1" />
              </div>
            </th>
          </ng-container>
        </ng-container>
        <tr
          mat-header-row
          *matHeaderRowDef="title"
          class="h-table_header_height bg-table_header"></tr>
        <ng-container *ngIf="gridType != 2">
          <tr
            mat-header-row
            *matHeaderRowDef="titleSearch"
            class="h-table_search_height bg-search_table_header"></tr>
        </ng-container>
        <!-- <tr mat-row *matRowDef="let row; columns: fields"></tr> -->
      </table>
    </div>
    <div class="example-container" #tblContent>
      <table mat-table [dataSource]="dataSource">
        <ng-container
          *ngFor="let column of fields; let indexColumn = index"
          [matColumnDef]="column.name"
          [sticky]="isSticky(column.name)">
          <!-- <th mat-header-cell *matHeaderCellDef [resizeColumn]="true" [index]="i">
          <span>{{ column }} </span>
        </th> -->
          <td
            mat-cell
            *matCellDef="let element; let indexRow = index"
            [width]="column.width + 'px'"
            class="px-2 align-middle">
            <div
              *ngIf="
                column.type !== 'action' &&
                column.type !== 'boolean' &&
                column.type !== 'select' &&
                column.type !== 'delete'
              "
              (click)="onhandleLookup(element, column)"
              class="text-medium text-left truncate overflow-ellipsis"
              [ngClass]="{
                'text-center': column.align === 'center',
                'text-right': column.align === 'right',
                'text-left': column.align === 'left',
                'cursor-pointer': column.isPrimaryKey && gridType === 1,
                'underline': column.isPrimaryKey && gridType === 1,
                'hover:text-green-600': column.isPrimaryKey && gridType === 1,
              }">
              <input
                *ngIf="!column.multipleLine"
                class="outline-none bg-transparent w-full"
                [readOnly]="column.readonly"
                [ngClass]="{
                  'text-center': column.align === 'center',
                  'text-right': column.align === 'right',
                  'text-left': column.align === 'left',
                  'cursor-pointer': column.isPrimaryKey && gridType === 1,
                  'underline': column.isPrimaryKey && gridType === 1,
                  'hover:text-green-600': column.isPrimaryKey && gridType === 1,
                }"
                type="text"
                [name]="column.name"
                [value]="
                  element[column.name]
                    | formatData : column.type : column.dataFormatString
                " />
              <textarea
                *ngIf="column.multipleLine"
                class="outline-none bg-transparent w-full"
                [readOnly]="column.readonly"
                [ngClass]="{
                  'text-center': column.align === 'center',
                  'text-right': column.align === 'right',
                  'text-left': column.align === 'left',
                  'cursor-pointer': column.isPrimaryKey && gridType === 1,
                  'underline': column.isPrimaryKey && gridType === 1,
                  'hover:text-green-600': column.isPrimaryKey && gridType === 1,
                }"
                type="text"
                [name]="column.name"
                [value]="
                  element[column.name]
                    | formatData : column.type : column.dataFormatString
                "></textarea>
              <!-- {{
                element[column.name]
                  | formatData : column.type : column.dataFormatString
              }} -->
            </div>
            <div
              *ngIf="column.type === 'boolean' || column.type === 'select'"
              (click)="onhandleLookup(element, column)"
              class="flex self-center text-medium justify-start"
              [ngClass]="{
                'justify-center':
                  column.align === 'center' || column.align === '',
                'justify-end': column.align === 'right',
                'justify-start': column.align === 'left',
                'cursor-pointer': column.isPrimaryKey && gridType === 1,
                'underline': column.isPrimaryKey && gridType === 1,
                'hover:text-green-600': column.isPrimaryKey && gridType === 1,
              }">
              <mat-checkbox
                [disabled]="column.type === 'boolean'"
                [(ngModel)]="element[column.name]"
                (change)="
                  onCheckboxChange(
                    element,
                    indexColumn,
                    indexRow,
                    $event.checked
                  )
                "></mat-checkbox>
            </div>
            <div
              *ngIf="column.type === 'action'"
              class="d-flex justify-content-center gap-3">
              <ng-container *ngFor="let action of column.actions">
                <button
                  *ngIf="action === 'delete'"
                  class="d-flex btn btn-danger p-0"
                  (click)="onHandleRemoveItem(element)">
                  <mat-icon class="align-self-center">{{ action }}</mat-icon>
                </button>
                <button
                  *ngIf="action === 'add'"
                  class="d-flex btn btn-success p-0"
                  (click)="onHandleAddService(element)">
                  <mat-icon class="align-self-center">{{
                    element['hang_chiet_khau'] ? 'cached' : action
                  }}</mat-icon>
                </button>
              </ng-container>
            </div>
          </td>
        </ng-container>

        <!-- <tr mat-header-row *matHeaderRowDef="fields"></tr> -->
        <tr
          mat-row
          *matRowDef="let row; index as i; columns: title"
          [ngClass]="{'bg-row_focus_color border-0.5': focusRow === i}"
          (click)="onClickRow(row, i)"
          class="h-table_row_height"></tr>
      </table>
      <div
        *ngIf="
          gridType !== 2 &&
          dataSource &&
          dataSource.data &&
          dataSource.data.length === 0 &&
          isLoadData
        "
        class="p-4 flex justify-center items-center text-4xl text-red-600 font-semibold"
        style="height: 100%">
        Không có dữ liệu
      </div>
      <div
        *ngIf="
          gridType !== 2 &&
          dataSource &&
          dataSource.data &&
          dataSource.data.length === 0 &&
          !isLoadData
        "
        class="flex flex-1 justify-center items-center h-full">
        <mat-spinner></mat-spinner>
      </div>
    </div>
    <div #paginatorRef>
      <mat-paginator
        *ngIf="gridType != 2"
        [pageSizeOptions]="pageSizeOptions"
        showFirstLastButtons
        (page)="onPageChange($event)"
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        aria-label="Select page">
      </mat-paginator>
    </div>

    Use of this source code is governed by an MIT-style license that
    can be found in the LICENSE file at http://angular.io/license -->
  </div>
</div>
