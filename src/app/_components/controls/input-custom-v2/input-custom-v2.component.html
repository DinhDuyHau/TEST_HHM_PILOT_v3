<div>
  <label class="col-form-label" for="{{ name }}" *ngIf="label">{{ label }} <span *ngIf="showRequireLabel" style="color:#f00;">(*)</span></label>
</div>
<div
  class="d-flex input-select flex-1 gap-2"
  *ngIf="type == 'text' || type == 'number'">
  <div class="flex-1 position-relative">
    <input
      class="form-control"
      [ngClass]="{
        'text-center': align === 'center',
        'text-end': align === 'end',
        'text-right': align === 'right',
        'text-left': align === 'left',
        'border-red-400 border-0.5 border-solid': !value && invalid
      }"
      id="{{ name }}"
      #ma
      [(ngModel)]="value"
      (ngModelChange)="onValueChange($event)"
      (blur)="onBlur($event)"
      (focus)="onFocus(ma)"
      [tabindex]="tabIndex"
      (keyup)="onKeyUp($event)"
      [readOnly]="readonly"
      [disabled]="disabled" />

    <!-- Susgestion box -->
      <!-- <ul
      *ngIf="lookup && !disabled && searchResult && searchResult.length > 0"
      class="absolute left-0 z-999 bg-white lookup-search shadow-md lg:text-ellipsis py-1 text-xs">
      <li
        *ngFor="let item of searchResult"
        class="flex py-1 hover:bg-primary01_color hover:text-white cursor-pointer"
        (click)="onClickSearchItem(item)">
        <div class="px-1 lookup-code basis-1/3">{{ item[getName()] }}</div>
        <div class="px-1 lookup-description flex-1">
          {{ getDesctioption(item) }}
        </div>
      </li>
    </ul> -->
    <!-- END Susgestion box -->

    <span *ngIf="!value && invalid" class="text-danger text-xs"
      >Chưa nhập thông tin {{ label.toLowerCase() }}</span
    >
    <div
      *ngIf="lookup && !disabled"
      class="position-absolute top-0 end-0"
      (click)="onFilter()">
      <div class="search-btn">
        <mat-icon>search</mat-icon>
      </div>
    </div>
    <!-- <div
      *ngIf="codeScanner"
      class="position-absolute top-0 end-0"
      (click)="onScanner()">
      <div class="search-btn"><i class="fa-solid fa-qrcode"></i></div>
    </div> -->
  </div>
  <div class="d-flex align-items-center" *ngIf="codeScanner">
    <div class="scan-btn" (click)="!disabled && onScanner()">
      <mat-icon class="icon">qr_code_scanner</mat-icon>
      <span>Quét mã</span>
    </div>
  </div>
  <div
    class="d-flex align-items-center gap-2"
    *ngIf="handleUploadImage.observers.length && !disabled">
    <div class="scan-btn" (click)="onClickUploadImage()">
      <mat-icon class="icon">add_a_photo</mat-icon>
    </div>
  </div>
  <div
    class="d-flex align-items-center"
    *ngIf="handleUploadImage.observers.length && !disabled">
    <div class="scan-btn" (click)="onClickUViewPhoto()">
      <mat-icon>remove_red_eye</mat-icon>
    </div>
  </div>
  <div class="d-flex align-items-center" *ngIf="action">
    <div
      class="scan-btn bg-primary02_color"
      (click)="!disabled && onClickAction()">
      <!-- <span>{{ titleButton }}</span> -->
      <mat-icon class="icon text-white">check</mat-icon>
    </div>
  </div>
  <div
    *ngFor="let button of buttons; let index = index"
    (click)="!disabled && onClickButton($event, button.id)"
    class="py-1.5 text-sm lg:text-base min-w-button_small lg:min-w-button flex items-center px-2 justify-center rounded-md"
    [style.backgroundColor]="button.buttonColor"
    [ngClass]="{
      'cursor-pointer':  !disabled,
      }">
    <fa-icon
      *ngIf="button.icon"
      class="flex items-center"
      [style.color]="button.iconColor"
      [icon]="['fas', castIcon(button.icon)]"
      size="sm"></fa-icon>
    <div
      class="text-medium font-normal"
      [ngClass]="{
        'ml-2':  button.icon,
        }"
      [ngStyle]="{color: button.iconColor}">
      {{ button.name }}
    </div>
  </div>
</div>

<div class="d-flex input-select flex-1 gap-2" *ngIf="type == 'date'">
  <div class="flex-1 position-relative">
    <input
      class="form-control"
      [ngClass]="{
        'text-center': align === 'center',
        'text-end': align === 'end',
        'text-right': align === 'right',
        'text-left': align === 'left',
        'border-red-400 border-0.5 border-solid': !value && invalid,
        'pl-6': !disabled
      }"
      id="{{ name }}"
      #ma
      [(ngModel)]="value"
      (blur)="onBlurDate($event)"
      [tabindex]="tabIndex"
      (keyup)="onEnterDate($event)"
      [readOnly]="readonly"
      [disabled]="disabled" />
    <input
      type="date"
      lang="vi-VN"
      value=""
      (change)="onDateChange($event)"
      #dateInput
      class="absolute left-0 top-0 bottom-0 text-lg w-5 outline-none bg-transparent cursor-pointer max-h-9"
      [disabled]="disabled" />
    <span *ngIf="!value && invalid" class="text-danger text-xs"
      >Chưa nhập thông tin {{ label.toLowerCase() }}</span
    >
  </div>

</div>
