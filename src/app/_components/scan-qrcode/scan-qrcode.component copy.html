<div mat-dialog-actions class="flex flex-col h-full bg-white">
  <div class="w-full relative flex justify-between p-1">
    <div class="scanner-shell" [hidden]="!hasDevices">
      <header>
        <!-- <select
          matNativeControl
          matInput
          (change)="onDeviceSelectChange($event)">
          <option value="" [selected]="!currentDevice">
            No Device Selected
          </option>
          <option
            *ngFor="let device of availableDevices"
            [value]="device.deviceId"
            [selected]="
              currentDevice && device.deviceId === currentDevice.deviceId
            ">
            {{ device.label }}
          </option>
        </select> -->
        <select-custom
          class="flex-1"
          [options]="availableDevicesSelect"
          optionDes="label"
          optionValue="deviceId"
          [value]="(currentDevice && currentDevice.deviceId) || ''"
          (handleChangeValue)="onDeviceSelectChange($event)" />
      </header>
      <div class="flex flex-1 items-center">
        <zxing-scanner
          previewFitMode="cover"
          [torch]="torchEnabled"
          [(device)]="currentDevice"
          (scanSuccess)="onCodeResult($event)"
          [formats]="formatsEnabled"
          [tryHarder]="tryHarder"
          (permissionResponse)="onHasPermission($event)"
          (camerasFound)="onCamerasFound($event)"
          (torchCompatible)="onTorchCompatible($event)"></zxing-scanner>
      </div>

      <section class="results" *ngIf="qrResultString">
        <div>
          <small>Result</small>
          <strong>{{ qrResultString }}</strong>
        </div>
        <button mat-icon-button (click)="clearResult()">&times;</button>
      </section>
    </div>
    <div
      class="flex flex-1 justify-center items-center w-full h-64"
      *ngIf="
        hasPermission === undefined ||
        hasPermission === false ||
        hasDevices === undefined ||
        hasDevices === false
      ">
      <mat-spinner></mat-spinner>
    </div>

    <!-- <ng-container *ngIf="hasPermission === undefined">
      <h2>Waiting for permissions.</h2>

      <blockquote>
        If your device does not has cameras, no permissions will be asked.
      </blockquote>
    </ng-container>

    <ng-container *ngIf="hasPermission === false">
      <h2>
        You denied the camera permission, we can't scan anything without it. 😪
      </h2>
    </ng-container>

    <ng-container *ngIf="hasDevices === undefined">
      <h2>Couldn't check for devices.</h2>

      <blockquote>This may be caused by some security error.</blockquote>
    </ng-container>

    <ng-container *ngIf="hasDevices === false">
      <h2>No devices were found.</h2>

      <blockquote>
        I believe your device has no media devices attached to.
      </blockquote>
    </ng-container> -->
  </div>
  <div class="w-full flex-1 relative flex justify-between px-2 pb-2 items-end">
    <!-- <button
      class="btn_close outline-none btn-danger btn"
      (click)="onClickDelete()"
      mat-icon-button
      mat-dialog-close
      aria-label="Close">
      Có
    </button> -->
    <div>
      <select-custom
        class="flex-1"
        [options]="availableCameraType"
        optionDes="name"
        optionValue="id"
        [value]="currentCameraType"
        (handleChangeValue)="onTypeCameraSelectChange($event)" />
    </div>

    <button
      class="btn_close outline-none btn-primary btn"
      (click)="onClickClose()"
      mat-icon-button
      mat-dialog-close
      aria-label="Close">
      Đóng
    </button>
  </div>
</div>
