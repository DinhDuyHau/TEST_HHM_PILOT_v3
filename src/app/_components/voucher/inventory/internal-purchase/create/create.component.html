<div
  class="px-1 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="title-page pb-2 flex justify-between items-center">
    <h5 class="">{{ title }}</h5>
    <app-voucher-info
      *ngIf="this.mode != 0"
      [entity]="entity"
      class="text-base"
      [voucherId]="data.masterInfo.stt_rec || ''" />
  </div>
  <form action="" [formGroup]="voucherForm" #form (ngSubmit)="onSubmit()">
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-3 pb-2">
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_so_ct')"
          class="flex-1"
          name="so_ct"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_ct'].value"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"
          [lookup]="true"
          [disabled]="true || disabled"
          [reference]="[so_ct]"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ct')"
          class="flex-1"
          type="date"
          name="ngay_ct"
          type="text"
          [dataFormatString]="'datetimeFormat'"
          [value]="f['ngay_ct'].value"
          [disabled]="true || disabled"
          (handleChange)="handleInputChange('ngay_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_cuahang_n')"
            #ma_cuahang
            name="ma_cuahang"
            [value]="f['ma_cuahang'].value"
            [invalid]="submitted && f['ma_cuahang'].errors != null"
            (handleEnter)="onEnter($event)"
            (handleChange)="handleInputChange('ma_cuahang', $event)"
            [control]="shopService"
            [lookup]="true"
            [disabled]="true || disabled"
            [reference]="[ma_cuahang, ten_cuahang]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_cuahang_n')"
            #ten_cuahang
            name="ten_cuahang"
            [value]="this.data.masterInfo['ten_cuahang']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_kho_n')"
            #ma_kho
            name="ma_kho"
            [value]="f['ma_kho'].value"
            [invalid]="submitted && f['ma_kho'].errors != null"
            (handleChange)="handleInputChange('ma_kho', $event)"
            (handleEnter)="onEnter($event)"
            [control]="stockService"
            [lookup]="true"
            [disabled]="true || disabled"
            [reference]="[ma_kho, ten_kho]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_kho_n')"
            #ten_kho
            name="ten_kho"
            [value]="this.data.masterInfo['ten_kho']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [isDisable]="disabled"
          [value]="data.masterInfo.status"
          (handleChangeValue)="data.masterInfo.status = $event" />
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_cuahang_x')"
            #ma_cuahang_x
            name="ma_cuahang"
            [value]="f['ma_cuahang_x'].value"
            [invalid]="submitted && f['ma_cuahang_x'].errors != null"
            (handleEnter)="onEnter($event)"
            (handleChange)="handleInputChange('ma_cuahang_x', $event)"
            [control]="shopService"
            [lookup]="true"
            [disabled]="true || disabled"
            [reference]="[ma_cuahang_x, ten_cuahang_x]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_cuahang_x')"
            #ten_cuahang_x
            [value]="this.data.masterInfo['ten_cuahang_x']"
            name="ten_cuahang"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_kho_x')"
            #ma_khox
            name="ma_kho"
            [value]="f['ma_khox'].value"
            (handleChange)="handleInputChange('ma_khox', $event)"
            (handleEnter)="onEnter($event)"
            [control]="stockService"
            [invalid]="submitted && f['ma_khox'].errors != null"
            [lookup]="true"
            [disabled]="true || disabled"
            [reference]="[ma_khox, ten_khox]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_kho_x')"
            #ten_khox
            name="ten_kho"
            [value]="this.data.masterInfo['ten_khox']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <!-- <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_vt')"
            #ma_vt
            name="ma_vt"
            [value]="f['item_code'].value"
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            (handleChangeLookup)="handleInputChange('item_code', $event)"
            [control]="itemService"
            [lookup]="true"
            [reference]="[ma_vt, ten_vt]"></app-input-custom-v2>
        </div>
        <div class="flex flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_vt')"
            #ten_vt
            name="ten_vt"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div> -->
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="getLabel('lbl_dien_giai')"
          class="flex-1"
          #input2
          (handleEnter)="onEnter($event)"
          name="dien_giai"
          [disabled]="disabled"
          (handleChange)="handleInputChange('dien_giai', $event)"
          [value]="f['dien_giai'].value"
          [invalid]="
            submitted && f['dien_giai'].errors != null
          "></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_imei')"
            name="imei"
            [value]="imei"
            [codeScanner]="true"
            [disabled]="disabled"
            type="text"
            (handleChange)="this.imei = $event"
            (handleScanner)="scanORCode($event)"
            (handleEnter)="onEnterIMEI($event)"></app-input-custom-v2>
        </div>
      </div>
    </div>
    <tabs-custom>
      <tab-custom label="Chi tiết" class="h-96 w-full">
        <app-grid-v2
          [fields]="fields"
          [dataSource]="dataSource"
          [isLockingColumn]="isLockingColumn"
          [disabled]="disabled"
          [gridType]="gridType"
          [buttons]="buttons"
          (handlePaging)="onPageChange($event)"
          (handleSelectColumn)="onSelectColumn($event)"
          (handleSortColumn)="onSortColumn($event)"
          (handleSearch)="onSearch()"
          (handleButton)="clickButton($event)"
          class="h-full w-full">
        </app-grid-v2>
      </tab-custom>
      <tab-custom label="Thông tin hóa đơn" class="h-96 w-full">
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-1 lg:gap-x-10 gap-y-1 lg:gap-y-3">
          <app-input-custom-v2
            class="flex-1"
            [label]="'Số hóa đơn'"
            name="so_ct0"
            [value]="data.masterInfo.so_ct0"
            [invalid]="submitted && f['so_ct0'].errors != null"
            (handleChange)="handleInputChange('so_ct0', $event)"
            [disabled]="disabled"></app-input-custom-v2>
          <app-input-custom-v2
            class="flex-1"
            [label]="'Ký hiệu'"
            name="so_seri0"
            [value]="data.masterInfo.so_seri0"
            [invalid]="submitted && f['so_seri0'].errors != null"
            (handleChange)="handleInputChange('so_seri0', $event)"
            [disabled]="disabled"></app-input-custom-v2>
          <app-input-custom-v2
            class="flex-1"
            type="date"
            [label]="'Ngày hóa đơn'"
            name="ngay_ct0"
            [value]="data.masterInfo.ngay_ct0"
            [dataFormatString]="'datetimeFormat'"
            [invalid]="submitted && f['ngay_ct0'].errors != null"
            (handleChange)="handleInputChange('ngay_ct0', $event)"
            [disabled]="disabled"></app-input-custom-v2>
        </div>
      </tab-custom>
    </tabs-custom>
    <!-- <div class="flex mt-2 flex-col">
      <div class="flex flex-1">
        <div class="flex basis-2/5"></div>
        <div class="flex flex-1">
          <div class="flex basis-1/3">Tổng số lượng</div>
          <div class="flex basis-1/3">
            <app-input
              name="ten_kh"
              type="number"
              [align]="'right'"
              dataFormatString="quantityViewFormat"
              [value]="f['t_so_luong'].value"
              [readonly]="true"></app-input>
          </div>
        </div>
        <div class="flex basis-1/3"></div>
      </div>
    </div> -->
    <div class="pb-4 border-b-0.5 border-solid border-gray-300"></div>
    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex">
        <!-- <app-voucher-info
          *ngIf="this.mode != 0"
          [entity]="entity"
          class="text-base"
          [voucherId]="data.masterInfo.stt_rec || ''" />
          &nbsp; -->
        <button
          *ngIf="this.submitButtonTitle !== '' && !readonly"
          #btnSubmit
          type="button"
          (click)="!disabled && onSubmit()"
          [disabled]="disabled && isDisabled"
          (click)="onSubmit()"
          class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm mr-1"></span>
          {{ submitButtonTitle }}
        </button>
        <button
          (click)="onCancel()"
          form=""
          class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300">
          {{ cancelButtonTitle }}
        </button>
      </div>
    </div>
  </form>
</div>
