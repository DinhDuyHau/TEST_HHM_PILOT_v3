<div
  class="px-1 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="title-page pb-2 flex justify-between items-center">
    <div class="flex">
      <h5 class="">{{ title }}</h5>
      <app-voucher-info-header
        [entity]="entity"
        [voucherId]="data.masterInfo.stt_rec || ''"
      />
    </div>
    <app-navigation-voucher
      [mode]="this.mode"
      [voucherId]="this.data.masterInfo.stt_rec || ''"
    />
  </div>
  <form action="" [formGroup]="voucherForm" #form>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-3 pb-2">
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_so_ct')"
          class="flex-1"
          name="so_ct"
          [disabled]="true || disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_ct'].value"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ct')"
          class="flex-1"
          type="date"
          name="ngay_ct"
          type="text"
          [dataFormatString]="'datetimeFormat'"
          [value]="f['ngay_ct'].value"
          [disabled]="true || disabled"
          (handleChange)="handleInputChange('ngay_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_nsd')"
            #ma_kh
            name="ma_kh"
            [disabled]="disabled"
            [value]="f['ma_kh'].value"
            [invalid]="submitted && f['ma_kh'].errors != null"
            (handleChange)="handleInputChange('ma_kh', $event)"
            (handleEnter)="onEnter($event)"
            [control]="customerService"
            [lookup]="true || disabled"
            [reference]="[ma_kh, ten_ncc]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_nsd')"
            #ten_ncc
            name="ten_kh"
            [value]="this.data.masterInfo['ten_kh']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_nguoi_nhan')"
            name="ong_ba"
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            (handleChange)="handleInputChange('ong_ba', $event)"
            [value]="f['ong_ba'].value"
            [invalid]="
              submitted && f['ong_ba'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>
      <div class="flex">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [isDisable]="disabled"
          [value]="data.masterInfo.status"
          (handleChangeValue)="data.masterInfo.status = $event" />
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          #ma_ho_so
          [label]="getLabel('lbl_ma_ho_so')"
          class="flex-1"
          name="ma_ho_so"
          [disabled]="disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['ma_ho_so'].value"
          [invalid]="submitted && f['ma_ho_so'].errors != null"
          (handleChange)="handleInputChange('ma_ho_so', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ho_so')"
          class="flex-1"
          type="date"
          name="ngay_ho_so"
          [dataFormatString]="'datetimeFormat'"
          [value]="f['ngay_ho_so'].value"
          [invalid]="submitted && f['ngay_ho_so'].errors != null"
          [disabled]="disabled"
          (handleChange)="handleInputChange('ngay_ho_so', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="getLabel('lbl_dien_giai')"
          class="flex-1"
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="dien_giai"
          (handleChange)="handleInputChange('dien_giai', $event)"
          [value]="f['dien_giai'].value"
          [invalid]="
            submitted && f['dien_giai'].errors != null
          "></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_imei')"
            name="imei"
            [value]="imei"
            [disabled]="disabled"
            [codeScanner]="true"
            type="text"
            (handleChange)="this.imei = $event"
            (handleScanner)="scanORCode($event)"
            (handleEnter)="onEnterIMEI($event)"></app-input-custom-v2>
        </div>
      </div>
    </div>
    <tabs-custom class="pt-2">
      <tab-custom label="Chi tiết" class="h-96 w-full">
        <app-grid-v2
          [fields]="fields"
          [dataSource]="dataSource"
          [isLockingColumn]="isLockingColumn"
          [gridType]="gridType"
          [buttons]="buttons"
          [actionButtons]="actionButtons"
          [disabled]="disabled"
          (handlePaging)="onPageChange($event)"
          (handleSelectColumn)="onSelectColumn($event)"
          (handleActionButton)="onHandleActionButton($event)"
          (handleSortColumn)="onSortColumn($event)"
          (handleSearch)="onSearch()"
          (handleButton)="clickButton($event)"
          class="h-full w-full">
        </app-grid-v2>
      </tab-custom>
    </tabs-custom>
    <!-- <div class="flex mt-2 flex-col">
        <div class="flex flex-1">
          <div class="flex basis-2/5"></div>
          <div class="flex flex-1">
            <div class="flex basis-1/3">Tổng số lượng</div>
            <div class="flex basis-1/3">
              <app-input
                name="ten_kh"
                type="number"
                [align]="'right'"
                dataFormatString="quantityViewFormat"
                [value]="f['t_so_luong'].value"
                [readonly]="true"></app-input>
            </div>
          </div>
          <div class="flex basis-1/3"></div>
        </div>
      </div> -->
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-1 lg:gap-x-10 gap-y-1 lg:gap-y-3">
      <div class="flex">
        <app-input-custom-v2
          #t_so_luong
          [label]="getLabel('lbl_t_so_luong')"
          class="flex-1"
          name="t_so_luong"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_so_luong"
          (handleChange)="handleInputChange('t_so_luong', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex">
        <app-input-custom-v2
          #t_tien_nt
          [label]="getLabel('lbl_t_tien')"
          class="flex-1"
          name="t_tien_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_tien_nt"
          (handleChange)="handleInputChange('t_tien_nt', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex">
        <app-input-custom-v2
          #t_thue_nt
          [label]="getLabel('lbl_t_thue')"
          class="flex-1"
          name="t_thue_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_thue_nt"
          (handleChange)="handleInputChange('t_thue_nt', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_t_tt')"
          class="flex-1"
          name="t_tt_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_tt_nt"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
    </div>
    <div class="pb-4 border-b-0.5 border-solid border-gray-300"></div>
    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex w-100 justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.data.masterInfo.stt_rec || ''"
        />
        <div class="d-flex gap-2 ms-auto">
          <app-voucher-info
            *ngIf="this.mode != 0"
            [entity]="entity"
            class="text-base"
            [voucherId]="data.masterInfo.stt_rec || ''" />
          <button class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300"
            *ngIf="submitButtonTitle !== '' && !readonly"
            #btnSubmit
            type="button"
            [disabled]="isDisabled"
            (click)="!disabled && onSubmit()">
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"></span>
            {{ submitButtonTitle }}
          </button>
          <div
            (click)="onCancel()"
            form=""
            class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300">
            {{ cancelButtonTitle }}
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
