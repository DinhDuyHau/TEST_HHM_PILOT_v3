<div
  class="px-1 md:px-2 lg:px-4 flex-1 bg-white position-relative ticket-container">
  <div class="d-flex flex-column gap-2 mt-5 flex-1">
    <div class="title-page pb-2 flex justify-between items-center">
      <h5 class="">{{ title }}</h5>
      <app-voucher-info
        *ngIf="this.mode != 0"
        [entity]="entity"
        class="text-base"
        [voucherId]="ticket.masterInfo.stt_rec" />
    </div>
    <div class="title-content">{{ getLabel('tlt_content') }}</div>
    <div class="box-container mb-3">
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'so_ct'"
          [label]="getLabel('lbl_so_ct')"
          [value]="ticket.masterInfo.so_ct"
          [disabled]="true" />
        <form-input-custom
          class="flex-1"
          [name]="'ngay_ct'"
          [label]="'Ngày lập'"
          [value]="ticket.masterInfo.ngay_ct"
          format="datetimeFormat"
          dataType="date"
          [disabled]="true" />
      </div>
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_gd'"
          [label]="'Mã giao dịch'"
          [value]="ticket.masterInfo.ma_gd"
          (handleClickOpenDialog)="openInventorySearchDialog()"
          [readonly]="true"
          [disabled]="false" />
        <form-input-custom
          class="flex-1"
          [name]="'ten_gd'"
          [label]="'Tên giao dịch'"
          [value]="ticket.masterInfo.ten_gd"
          [disabled]="true" />
      </div>
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_nvkk01'"
          [label]="'Mã nhân viên 1'"
          [value]="ticket.masterInfo.ma_nvkk01"
          [disabled]="true" />
        <form-input-custom
          class="flex-1"
          [name]="'ten_nvkk01'"
          [label]="'Tên nhân viên 1'"
          [value]="ticket.masterInfo.ten_nvkk01"
          [disabled]="true" />
      </div>

      <div class="box order-dynamic-1 d-flex gap-3">
        <form-select-custom
          class="flex-1"
          [isDisable]="readonly || disableSelectStatus"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [value]="ticket.masterInfo.status"
          (handleChangeValue)="ticket.masterInfo.status = $event" />
      </div>
      <form-input-custom
        #txt_dien_giai
        class="box order-dynamic-2"
        [name]="'dien_giai'"
        [label]="getLabel('lbl_dien_giai')"
        [value]="ticket.masterInfo.dien_giai"
        (handleChangeValue)="
          ticket.masterInfo.dien_giai = txt_dien_giai.value
        " />
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_nvkk02'"
          [label]="'Mã nhân viên 2'"
          (handleClickOpenDialog)="openEmployeeSearchDialog('2')"
          [value]="ticket.masterInfo.ma_nvkk02"
          [disabled]="false" />
        <form-input-custom
          class="flex-1"
          [name]="'ten_nvkk02'"
          [label]="'Tên nhân viên 2'"
          [value]="ticket.masterInfo.ten_nvkk02"
          [disabled]="true" />
      </div>

      <div class="box order-dynamic-3 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'nh_vt1'"
          [label]="'Chủng loại'"
          (handleClickOpenDialog)="openItemGroupSearchDialog(1)"
          (handleChangeValue)="onChangeItemGroup($event,1)"
          [value]="ticket.masterInfo.nh_vt1"
          [disabled]="isItemInfoDisabled" />
        <form-input-custom
          class="flex-1"
          [name]="'nh_vt2'"
          [label]="'Hãng sản xuất'"
          (handleClickOpenDialog)="openItemGroupSearchDialog(2)"
          (handleChangeValue)="onChangeItemGroup($event,2)"
          [value]="ticket.masterInfo.nh_vt2"
          [disabled]="isItemInfoDisabled" />
      </div>
      <div class="box order-dynamic-3 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'nh_vt3'"
          [label]="'Loại model'"
          (handleClickOpenDialog)="openItemGroupSearchDialog(3)"
          (handleChangeValue)="onChangeItemGroup($event,3)"
          [value]="ticket.masterInfo.nh_vt3"
          [disabled]="isItemInfoDisabled" />
        <form-input-custom
          class="flex-1"
          [name]="'nh_vt4'"
          [label]="'Cấu hình'"
          (handleClickOpenDialog)="openItemGroupSearchDialog(4)"
          (handleChangeValue)="onChangeItemGroup($event,4)"
          [value]="ticket.masterInfo.nh_vt4"
          [disabled]="isItemInfoDisabled" />
      </div>
      <div class="box order-dynamic-3 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_nvkk03'"
          [label]="'Mã nhân viên 3'"
          (handleClickOpenDialog)="openEmployeeSearchDialog('3')"
          [value]="ticket.masterInfo.ma_nvkk03"
          [disabled]="false" />
        <form-input-custom
          class="flex-1"
          [name]="'ten_nvkk03'"
          [label]="'Tên nhân viên 3'"
          [value]="ticket.masterInfo.ten_nvkk03"
          [disabled]="true" />
      </div>

      <div class="box order-dynamic-3 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_vt'"
          [label]="'Mã vật tư'"
          (handleClickOpenDialog)="openItemListDialog(ticket.masterInfo.nh_vt1,ticket.masterInfo.nh_vt2,ticket.masterInfo.nh_vt3)"
          (handleChangeValue)="onChangeItem($event)"
          (handleEnterInput)="onEnterItemCode($event)"
          [value]="ticket.masterInfo.ma_vt"
          [disabled]="isItemInfoDisabled" />
        <form-input-custom
          class="flex-1"
          [name]="'ten_vt'"
          [label]="'Tên vật tư'"
          [value]="ticket.masterInfo.ten_vt"
          [disabled]="true" />
      </div>
      <div class="box order-dynamic-1 d-flex">
        <form-input-custom
          #txtImei2
          [name]="'ma_imei_tt'"
          [label]="'Imei xuất bán khi kiểm kê'"
          [tabIndex]="tabIndex.imei"
          *ngIf="!readonly"
          (handleEnterInput)="onEnterImeiCode2($event); txtImei2.value = ''"
         />
      </div>
      <div class="box order-dynamic-1 d-flex">
        <form-input-custom
          #txtImei
          [name]="'ma_imei_tt'"
          [label]="getLabel('lbl_imei')"
          [tabIndex]="tabIndex.imei"
          *ngIf="!readonly"
          (handleEnterInput)="onEnterImeiCode($event); txtImei.value = ''"
          (handleClickCodeScanner)="onClickCodeScanner()"
          [uploadImage]="true" />
      </div>
    </div>

    <div class="d-flex justify-content-end">
      <button
        class="btn-input-imei text-nowrap"
        [hidden]="isStockCheckDisabled"
        (click)="onClickCheckInventory()">
        Lấy tồn kho
      </button>
    </div>
    

    <tabs-custom title="Thông tin hàng hóa">
      <tab-custom label="Hàng hoá" class="w-100">
        <table-custom
          [type]="'main'"
          [dataSource]="ticket.merchandise"
          [columns]="merchandiseColumns"
          [readonly]="readonly"
          [isChangeColorWhenSelected]="true"
          [isShowDiscountNG]="true"
          [isTicket]="false"
          (handleDelete)="onRemoveMerchandise($event)" />
      </tab-custom>
    </tabs-custom>
          <!-- (handleUpdate)="onOpenInputImeiModal($event)" -->
           
    <div>
      <div class="d-flex justify-end gap-2 m-3">
        <app-voucher-info
          *ngIf="this.mode != 0"
          [entity]="entity"
          class="text-base"
          [voucherId]="ticket.masterInfo.stt_rec" />
        <div class="btn-responsive btn-in-file">
          <span>{{ getLabel('btnPrint') }}</span>
        </div>
        <div class="btn-responsive btn-cancel" (click)="onCancel()">
          {{ cancelButtonTitle }}
        </div>
        <button
          class="btn-responsive btn-add"
          (click)="onSave()"
          [disabled]="isDisabled"
          *ngIf="!readonly">
          {{ submitButtonTitle }}
        </button>
        <app-send-email
          *ngIf="this.mode == 2"
          [voucherId]="this.ticket.masterInfo.stt_rec"
          [email]="this.ticket.masterInfo.email_nhan_key"
          [status]="this.ticket.masterInfo.status"/>
      </div>
    </div>
  </div>

  <div
    *ngIf="isSaving"
    class="position-absolute start-0 top-0 opacity-50"
    style="width: 100%; height: 100%; background-color: rgb(193, 193, 193)">
    <div class="position-absolute top-50 start-50 translate-middle">
      <div class="d-flex flex-column">
        <div class="spinner-border text-dark align-self-center" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Đang lưu</p>
      </div>
    </div>
  </div>
</div>
