<div
  class="px-1 md:px-2 lg:px-4 flex-1 bg-white position-relative ticket-container">
  <div class="d-flex flex-column gap-2 mt-5 flex-1">
    <div class="title-page pb-2 flex justify-between items-center">
      <div class="flex">
        <h5 class="">{{ title }}</h5>
        <app-voucher-info-header
          [entity]="entity"
          [voucherId]="ticket.masterInfo.stt_rec"
        />
      </div>
      <app-navigation-voucher
        [mode]="this.mode"
        [voucherId]="ticket.masterInfo.stt_rec"
      />
    </div>
    <div class="title-content">{{ getLabel('tlt_content') }}</div>
    <div class="box-container mb-3">
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'so_ct'"
          [label]="getLabel('lbl_so_ct')"
          [value]="ticket.masterInfo.so_ct"
          [disabled]="true" />
        <form-input-custom
          class="flex-1"
          [name]="'ngay_ct'"
          [label]="getLabel('lbl_ngay_ct')"
          [value]="ticket.masterInfo.ngay_ct"
          format="datetimeFormat"
          dataType="date"
          [disabled]="true" />
      </div>
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_cuahang'"
          [label]="'Cửa hàng xuất'"
          [value]="ticket.masterInfo.ma_cuahang"
          [disabled]="true" />
        <form-input-custom
          class="flex-4"
          [name]="'ten_cuahang'"
          [label]="'Tên cửa hàng xuất'"
          [value]="ticket.masterInfo.ten_cuahang"
          [disabled]="true" />
      </div>
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_kho'"
          [label]="'Mã kho xuất'"
          [tabIndex]="tabIndex.ma_kho"
          [value]="ticket.masterInfo.ma_kho"
          (handleChangeValue)="onChangeValueExportInventoryCode($event)"
          (handleClickOpenDialog)="openExportInventorySearchDialog()"
          [disabled]="disableLookup" />
        <form-input-custom
          class="flex-4"
          [name]="'ten_kho'"
          [label]="'Tên kho xuất'"
          [value]="ticket.masterInfo.ten_kho"
          [disabled]="true" />
      </div>
      <form-select-custom
        class="box order-dynamic-1 width-full"
        [isDisable]="false"
        [label]="getLabel('lbl_trang_thai')"
        [options]="statusList"
        optionDes="statusname"
        optionValue="status"
        [value]="ticket.masterInfo.status"
        (handleChangeValue)="ticket.masterInfo.status = $event" />
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'ma_cuahang_n'"
          [label]="'Cửa hàng nhập'"
          [value]="ticket.masterInfo.ma_cuahang_n"
          (handleChangeValue)="onChangeImportStore($event)"
          (handleClickOpenDialog)="
            ticket.masterInfo.fnote2 === '2' && openSearchShopDialog()
          "
          [readonly]="ticket.masterInfo.fnote2 === '2'"
          [disabled]="
            ticket.masterInfo.fnote2 === '1' || disableLookup
          " />
        <form-input-custom
          class="flex-4"
          [name]="'ten_cuahang_n'"
          [label]="'Tên cửa hàng nhập'"
          [value]="ticket.masterInfo.ten_cuahang_n"
          [disabled]="true" />
      </div>
      <div class="box order-dynamic-1 d-flex gap-3">
        <form-input-custom
          class="flex-1"
          [name]="'so_ct'"
          [label]="'Mã kho nhập'"
          [tabIndex]="tabIndex.ma_khon"
          [value]="ticket.masterInfo.ma_khon"
          (handleChangeValue)="onChangeValueImportInventoryCode($event)"
          (handleClickOpenDialog)="openImportInventorySearchDialog()"
          [disabled]="
            (ticket.masterInfo.fnote2 === '1' && !ticket.masterInfo.ma_kho) ||
            disableLookup
          " />
        <form-input-custom
          class="flex-4"
          [name]="'ten_khon'"
          [label]="'Tên kho nhập'"
          [value]="ticket.masterInfo.ten_khon"
          [disabled]="true" />
      </div>
      <form-select-custom
        class="box order-dynamic-1 width-full"
        [isDisable]="readonly || this.mode !== 0"
        [label]="'Loại giao dịch'"
        [options]="transactionTypeOptions"
        optionDes="label"
        optionValue="value"
        [value]="ticket.masterInfo.fnote2"
        (handleChangeValue)="onChangeTransactionType($event)" />

      <form-input-custom
        #txtImei
        class="box order-dynamic-2"
        [name]="'imei'"
        [label]="getLabel('lbl_imei')"
        [tabIndex]="tabIndex.imei"
        *ngIf="!readonly"
        (handleEnterInput)="onEnterImeiCode($event); txtImei.value = ''"
        (handleClickCodeScanner)="onClickCodeScanner()"
        [uploadImage]="true" />

      <form-input-custom
        #txt_dien_giai
        class="box order-dynamic-2"
        [name]="'dien_giai'"
        [label]="getLabel('lbl_dien_giai')"
        [value]="ticket.masterInfo.dien_giai"
        (handleChangeValue)="
          ticket.masterInfo.dien_giai = txt_dien_giai.value
        " />
    </div>

    <div class="d-flex justify-content-end">
      <button
        class="btn-input-imei text-nowrap"
        (click)="onOpenInputImeiModal()">
        Nhập danh sách imei
      </button>
    </div>

    <tabs-custom title="Thông tin hàng hóa">
      <tab-custom label="Hàng hoá" class="w-100">
        <table-custom
          [type]="'main'"
          [dataSource]="ticket.merchandise"
          [columns]="merchandiseColumns"
          [readonly]="readonly"
          [isChangeColorWhenSelected]="true"
          [isShowDiscountNG]="true"
          [isTicket]="false"
          (handleUpdate)="onOpenInputImeiModal($event)"
          (handleDelete)="onRemoveMerchandise($event)" />
      </tab-custom>
    </tabs-custom>

    <div class="transport d-flex flex-1 gap-3">
      <div class="d-flex gap-3 col-6">
        <form-input-custom
          class="flex-1"
          [disabled]="true"
          [label]="'Tổng số lượng'"
          [align]="'end'"
          [value]="ticket.masterInfo.t_so_luong"
          format="moneyViewFormat"
          dataType="number" />
        <form-input-custom
          class="flex-1"
          [name]="'so_dh_vc'"
          [label]="'Mã đơn hàng'"
          [value]="ticket.masterInfo.fcode1"
          (handleChangeValue)="ticket.masterInfo.fcode1 = $event" />
        <form-input-custom
          class="flex-1"
          [name]="'ma_van_don'"
          [label]="'Mã vận đơn'"
          [value]="ticket.masterInfo.fcode2"
          (handleChangeValue)="ticket.masterInfo.fcode2 = $event" />
      </div>
      <div class="d-flex gap-3 col-6">
        <form-input-custom
          class="flex-1"
          [name]="'ma_nv_giao'"
          [label]="'Mã NV vận chuyển'"
          [value]="ticket.masterInfo.fcode3"
          (handleEnterInput)="onEnterDECode($event)"
          (handleClickOpenDialog)="onOpenDialogTransport()"/>
        <form-input-custom
          class="flex-1"
          [name]="'ten_kh'"
          [label]="'Tên NV vận chuyển'"
          [value]="ten_nvvc"
          [readonly]="true"
          [disabled]="true" />
      </div>
    </div>

    <div>
      <div class="d-flex justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.ticket.masterInfo.stt_rec"
        />

        <div class="d-flex gap-2 ms-auto">
          <app-voucher-info
            *ngIf="this.mode != 0"
            [entity]="entity"
            class="text-base"
            [voucherId]="ticket.masterInfo.stt_rec" />
          <div class="btn-responsive btn-in-file">
            <span>{{ getLabel('btnPrint') }}</span>
          </div>
          <div class="btn-responsive btn-cancel" (click)="onCancel()">
            {{ cancelButtonTitle }}
          </div>
          <button
            class="btn-responsive btn-add"
            [disabled]="disable && isDisabled"
            (click)="onSave()"
            *ngIf="!readonly">
            {{ submitButtonTitle }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="isSaving"
    class="position-absolute start-0 top-0 opacity-50"
    style="width: 100%; height: 100%; background-color: rgb(193, 193, 193)">
    <div class="position-absolute top-50 start-50 translate-middle">
      <div class="d-flex flex-column">
        <div class="spinner-border text-dark align-self-center" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Đang lưu</p>
      </div>
    </div>
  </div>
</div>
