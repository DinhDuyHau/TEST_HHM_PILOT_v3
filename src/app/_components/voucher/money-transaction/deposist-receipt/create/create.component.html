<div
  class="px-1 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="title-page pb-2 flex justify-between items-center">
    <div class="flex">
      <h5 class="">{{ title }}</h5>
      <app-voucher-info-header
        [entity]="entity"
        [voucherId]="data.masterInfo.stt_rec || ''"
      />
    </div>
    <div class="flex">
      <button
        *ngIf="this.mode === 0 || this.mode === 1"
        class="flex-1 btn act-input-data-btn text-nowrap"
        style="height:36px;"
        (click)="openAddCustomerDialog()"
        [disabled]="isInputDisabled()"
      >
        {{ getLabel('lbl_add_customer') }}
      </button>
      &nbsp;
      <app-navigation-voucher
        [mode]="this.mode"
        [voucherId]="this.data.masterInfo.stt_rec || ''"
      />
    </div>
  </div>
  <form action="" [formGroup]="voucherForm" #form>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-3 pb-2">
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_so_ct')"
          class="flex-1"
          name="so_ct"
          [disabled]="true || disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_ct'].value"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ct')"
          class="flex-1"
          type="date"
          name="ngay_ct"
          type="text"
          [value]="f['ngay_ct'].value"
          [disabled]="true || disabled"
          [dataFormatString]="'datetimeFormat'"
          (handleChange)="handleInputChange('ngay_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_kh')"
            #ma_kh
            name="ma_kh"
            [disabled]="isInputDisabled()"
            [value]="f['ma_kh'].value"
            [invalid]="submitted && f['ma_kh'].errors != null"
            (handleChangeLookup)="handleInputLookupChange($event)"
            (handleEnter)="onEnter($event);onEnterCustomerCode($event, ma_kh.value);"
            [control]="customerService"
            [lookup]="true || disabled"
            [reference]="[ma_kh, ten_kh, dia_chi]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_kh')"
            #ten_kh
            name="ten_kh"
            [value]="this.data.masterInfo['ten_kh']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_dia_chi')"
            #dia_chi
            name="dia_chi"
            [disabled]="isInputDisabled()"
            (handleEnter)="onEnter($event)"
            name="dia_chi"
            (handleChange)="handleInputChange('dia_chi', $event)"
            [value]="f['dia_chi'].value"
            [invalid]="
              submitted && f['dia_chi'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>

      <!-- LOẠI GIAO DỊCH -->
      <div class="flex">
        <select-custom
          class="flex-1"
          [label]="'Loại giao dịch'"
          [options]="tran_type"
          optionDes="ten_loai"
          optionValue="ma_loai"
          [isDisable]="isInputDisabled()"
          [value]="data.masterInfo.fnote3"
          (handleChangeValue)="data.masterInfo.fnote3 = $event" />
      </div>

      <div class="flex gap-2">
        <div class="flex flex-1">
          <app-input-custom-v2
            [label]="getLabel('lbl_dien_giai')"
            class="flex-1"
            #input_dien_giai
            [disabled]="isInputDisabled()"
            (handleEnter)="onEnter($event)"
            name="dien_giai"
            (handleChange)="handleInputChange('dien_giai', $event)"
            [value]="f['dien_giai'].value"
            [invalid]="
              submitted && f['dien_giai'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            [label]="getLabel('lbl_nguoi_nop')"
            class="flex-1"
            #input2
            [disabled]="isInputDisabled()"
            (handleEnter)="onEnter($event)"
            name="ong_ba"
            (handleChange)="handleInputChange('ong_ba', $event)"
            [value]="f['ong_ba'].value"
            [invalid]="
              submitted && f['ong_ba'].errors != null
            "></app-input-custom-v2>
        </div>

        <div class="flex basis-1/3 descript-wrap">
          <a *ngIf="data.masterInfo.fnote3 === '1'"
            class="btn-order btn act-input-data-btn text-nowrap ng-star-inserted"
            (click)="getDeposistProduct()">Lấy hàng đặt cọc</a>
          <span *ngIf="data.masterInfo.fnote3 !== '1'">&nbsp;</span>
        </div>
      </div>

      <div class="flex">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [isDisable]="disabled"
          [value]="data.masterInfo.status"
          (handleChangeValue)="data.masterInfo.status = $event" />
      </div>

      <div *ngIf="data.masterInfo.fnote3 === '2'" class="flex grap-2">
        <div class="flex basis-1/3" style="margin-right:5px;">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_vt')"
            #ma_vt
            name="ma_vt"
            [value]="ma_vt_coc"
            [disabled]="isInputDisabled()"
            (handleChangeLookup)="ma_vt_coc = $event[0].value; ten_vt_coc = $event[1].value"
            (handleEnter)="onEnter($event)"
            [control]="itemService"
            [lookup]="true || disabled"
            [reference]="[ma_vt, ten_vt]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_vt')"
            #ten_vt
            name="ten_vt"
            [value]="ten_vt_coc"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>

      <div *ngIf="data.masterInfo.fnote3 === '2'" class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            [label]="getLabel('lbl_tien_dat_coc')"
            class="flex-1"
            #input_tien_coc
            name="tien_coc"
            [dataFormatString]="'moneyInputFormat'"
            [disabled]="isInputDisabled()"
            type="number"
            [align]="'right'"
            [value]="tien_dat_coc"
            (handleEnter)="onEnter($event)"
            (handleChange)="tien_dat_coc = $event"
            ></app-input-custom-v2>
        </div>

        <div class="flex basis-1/3 descript-wrap">
          <a class="btn-order btn act-input-data-btn text-nowrap ng-star-inserted"
            (click)="addDeposistType02(ma_vt_coc, ten_vt_coc, tien_dat_coc)">Thêm đặt cọc</a>
        </div>
      </div>

    </div>

    <tabs-custom class="pt-2">
      <tab-custom label="Chi tiết" class="h-80 w-full">
        <app-grid-v2
          [fields]="fields"
          [dataSource]="dataSource"
          [isLockingColumn]="isLockingColumn"
          [gridType]="gridType"
          [buttons]="buttons"
          [actionButtons]="actionButtons"
          [disabled]="isInputDisabled()"
          (handlePaging)="onPageChange($event)"
          (handleSelectColumn)="onSelectColumn($event)"
          (handleActionButton)="onHandleActionButton($event)"
          (handleSortColumn)="onSortColumn($event)"
          (handleSearch)="onSearch()"
          class="h-full w-full">
        </app-grid-v2>
      </tab-custom>
    </tabs-custom>

    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-1 lg:gap-x-10 gap-y-1 lg:gap-y-3">
      <div class="hidden lg:flex"></div>
      <div class="hidden lg:flex"></div>
      <div class="hidden lg:flex"></div>
      <div class="flex">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_t_tien')"
          class="flex-1"
          name="t_tt_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_tt_nt"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
    </div>
    <div class="pb-4 border-b-0.5 border-dashed border-gray-300" style="margin-bottom:20px;"></div>

    <ng-container>
      <payment-tab
        [status]="data.masterInfo.status || ''"
        [so_ct]="data.masterInfo.so_ct || ''"
        [stt_rec]="data.masterInfo.stt_rec || ''"
        [action]="action"
        [shop]="shop"
        [invalid]="invalid"
        [pay_hidden]="[
          'tien_dat_coc',
          'tra_gop',
          'sd_diem',
          'ma_giam_gia',
          'giam_gia_crm',
          'chiet_khau',
          'voucher_doi_tac',
          'quet_the_tra_gop'
        ]"
        [readonly]="disabled"
        [t_tong_tien]="data.masterInfo.t_tt_nt || 0"
        [data]="payment"
        [t_con_no]="data.masterInfo.t_con_no || 0"
        [t_da_tra]="data.masterInfo.t_da_tra || 0"
        (handleChangeValue)="onPaymentChange($event)" />
    </ng-container>

    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex w-100 justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.data.masterInfo.stt_rec || ''"
        />
        <div class="d-flex gap-2 ms-auto">
          <button class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300"
            *ngIf="submitButtonTitle !== '' && !readonly"
            #btnSubmit
            type="button"
            [disabled]="isDisabled"
            (click)="!disabled && onSubmit()">
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"></span>
            {{ submitButtonTitle }}
          </button>
          <div
            (click)="onCancel()"
            form=""
            class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300">
            {{ cancelButtonTitle }}
          </div>
        </div>
      </div>
    </div>

  </form>
</div>
