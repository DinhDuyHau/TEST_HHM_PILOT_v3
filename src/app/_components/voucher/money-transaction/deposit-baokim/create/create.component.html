<div
  class="px-1 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="title-page pb-2 flex justify-between items-center">
    <div class="flex">
      <h5 class="">{{ title }}</h5>
      <app-voucher-info-header
        [entity]="entity"
        [voucherId]="data.masterInfo.stt_rec || ''"
      />
    </div>
  </div>
  <form action="" [formGroup]="voucherForm" #form>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-3 pb-2">
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_so_ct')"
          class="flex-1"
          name="so_ct"
          [disabled]="true || disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_ct'].value"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ct')"
          class="flex-1"
          type="date"
          name="ngay_ct"
          type="text"
          [value]="f['ngay_ct'].value"
          [disabled]="true || disabled"
          [dataFormatString]="'datetimeFormat'"
          (handleChange)="handleInputChange('ngay_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_kh')"
            #ma_kh
            name="ma_kh"
            [disabled]="disabled"
            [value]="f['ma_kh'].value"
            [invalid]="submitted && f['ma_kh'].errors != null"
            (handleChangeLookup)="handleInputLookupChange($event)"
            (handleEnter)="onEnter($event);onEnterCustomerCode($event, ma_kh.value);"
            [control]="customerService"
            [lookup]="true || disabled"
            [reference]="[ma_kh, ten_kh, dia_chi]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_kh')"
            #ten_kh
            name="ten_kh"
            [value]="this.data.masterInfo['ten_kh']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_dia_chi')"
            #dia_chi
            name="dia_chi"
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            name="dia_chi"
            (handleChange)="handleInputChange('dia_chi', $event)"
            [value]="f['dia_chi'].value"
            [invalid]="
              submitted && f['dia_chi'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex flex-1">
          <app-input-custom-v2
            [label]="'Mã giao dịch Bảo Kim'"
            class="flex-1"
            #input2
            [disabled]="disabled"
            name="ma_gd_baokim"
            (handleChange)="handleInputChange('ma_gd_baokim', $event)"
            [value]="f['ma_gd_baokim'].value"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [isDisable]="disabled"
          [value]="data.masterInfo.status"
          (handleChangeValue)="data.masterInfo.status = $event" />
      </div>
      <div class="flex gap-2">
        <div class="flex flex-1">
          <app-input-custom-v2
            [label]="getLabel('lbl_nguoi_nop')"
            class="flex-1"
            #input2
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            name="ong_ba"
            (handleChange)="handleInputChange('ong_ba', $event)"
            [value]="f['ong_ba'].value"
            [invalid]="
              submitted && f['ong_ba'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_cccd
          [label]="'Số CCCD'"
          class="flex-1"
          name="so_cccd"
          [disabled]="true || disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_cccd'].value"
          (handleChange)="handleInputChange('so_cccd', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="'Ngày cấp CCCD'"
          class="flex-1"
          type="date"
          name="ngay_cap_cccd"
          type="text"
          [value]="f['ngay_cap_cccd'].value"
          [disabled]="true || disabled"
          [dataFormatString]="'datetimeFormat'"
          (handleChange)="handleInputChange('ngay_cap_cccd', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="'Nơi cấp CCCD'"
            [value]="f['noi_cap_cccd'].value"
            (handleChange)="handleInputChange('noi_cap_cccd', $event)"
            name="noi_cap_cccd"
            type="text"
            [disabled]="disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-3">
        <app-input-custom-v2
          [label]="'Số TK nhận'"
          class="flex-1"
          #input2
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="ten_kh"
          (handleChange)="handleInputChange('tk_ngan_hang', $event)"
          [value]="f['tk_ngan_hang'].value"
          [invalid]="
            submitted && f['tk_ngan_hang'].errors != null
          "></app-input-custom-v2>
        <app-input-custom-v2
          [label]="'Tên TK nhận'"
          class="flex-1"
          #input2
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="ten_kh"
          (handleChange)="handleInputChange('ten_tk_nganhang', $event)"
          [value]="f['ten_tk_nganhang'].value"
          [invalid]="
            submitted && f['ten_tk_nganhang'].errors != null
          "></app-input-custom-v2>
        <app-input-custom-v2
          [label]="'Tên TK nhận'"
          class="flex-1"
          #input2
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="ten_kh"
          (handleChange)="handleInputChange('ten_nganhang', $event)"
          [value]="f['ten_nganhang'].value"
          [invalid]="
            submitted && f['ten_nganhang'].errors != null
          "></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="getLabel('lbl_ly_do_nop')"
          class="flex-1"
          #input2
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="ten_kh"
          (handleChange)="handleInputChange('dien_giai', $event)"
          [value]="f['dien_giai'].value"
          [invalid]="
            submitted && f['dien_giai'].errors != null
          "></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ghi_chu')"
            [value]="f['ghi_chu'].value"
            (handleChange)="handleInputChange('ghi_chu', $event)"
            name="ghi_chu"
            type="text"
            [disabled]="disabled"></app-input-custom-v2>
        </div>
      </div>
    </div>

    <tabs-custom class="pt-2">
      <tab-custom label="Chi tiết" class="h-80 w-full">
        <app-grid-v2
          [fields]="fields"
          [dataSource]="dataSource"
          [isLockingColumn]="isLockingColumn"
          [gridType]="gridType"
          [buttons]="buttons"
          [actionButtons]="actionButtons"
          [disabled]="disabled"
          (handlePaging)="onPageChange($event)"
          (handleSelectColumn)="onSelectColumn($event)"
          (handleActionButton)="onHandleActionButton($event)"
          (handleSortColumn)="onSortColumn($event)"
          (handleSearch)="onSearch()"
          class="h-full w-full">
        </app-grid-v2>
      </tab-custom>
    </tabs-custom>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-1 lg:gap-x-10 gap-y-1 lg:gap-y-3">
      <div class="hidden lg:flex"></div>
      <div class="hidden lg:flex"></div>
      <div class="hidden lg:flex"></div>
      <div class="flex">
        <app-input-custom-v2
          #so_ct
          [label]="'Tổng tiền phải thu khách'"
          class="flex-1"
          name="t_tt_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_tt_nt"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
    </div>
    <div class="pb-4 border-b-0.5 border-solid border-gray-300"></div>
    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex w-100 justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.data.masterInfo.stt_rec || ''"
        />
        <div class="d-flex gap-2 ms-auto">
          <app-voucher-info
            *ngIf="this.mode != 0"
            [entity]="entity"
            class="text-base"
            [voucherId]="data.masterInfo.stt_rec || ''" />
          <button class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300"
            *ngIf="submitButtonTitle !== '' && !readonly"
            #btnSubmit
            type="button"
            [disabled]="isDisabled"
            (click)="!disabled && onSubmit()">
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"></span>
            {{ submitButtonTitle }}
          </button>
          <div
            (click)="onCancel()"
            form=""
            class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300">
            {{ cancelButtonTitle }}
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
