<div
  class="px-1 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="title-page pb-2 flex justify-between items-center">
    <h5 class="">{{ title }}</h5>
    <app-voucher-info
      *ngIf="this.mode != 0"
      [entity]="entity"
      class="text-base"
      [voucherId]="data.masterInfo.stt_rec || ''" />
  </div>
  <form action="" [formGroup]="voucherForm" #form>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-3 pb-2">
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_so_ct')"
          class="flex-1"
          name="so_ct"
          [disabled]="true || disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_ct'].value"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ct')"
          class="flex-1"
          type="date"
          name="ngay_lct"
          type="text"
          [value]="f['ngay_lct'].value"
          [disabled]="true || disabled"
          [dataFormatString]="'datetimeFormat'"
          (handleChange)="handleInputChange('ngay_lct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_kh')"
            #ma_kh
            name="ma_kh"
            [disabled]="disabled"
            [value]="f['ma_kh'].value"
            [invalid]="submitted && f['ma_kh'].errors != null"
            (handleChangeLookup)="handleInputLookupChange($event)"
            (handleEnter)="onEnter($event)"
            [control]="customerService"
            [lookup]="true || disabled"
            [reference]="[ma_kh, ten_kh, dia_chi]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_kh')"
            #ten_kh
            name="ten_kh"
            [value]="this.data.masterInfo['ten_kh']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_dia_chi')"
            #dia_chi
            name="dia_chi"
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            name="dia_chi"
            (handleChange)="handleInputChange('dia_chi', $event)"
            [value]="f['dia_chi'].value"
            [invalid]="
              submitted && f['dia_chi'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [isDisable]="disabled"
          [value]="data.masterInfo.status"
          (handleChangeValue)="data.masterInfo.status = $event" />
        <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ht')"
          class="flex-1"
          type="date"
          name="ngay_ct"
          type="text"
          [value]="f['ngay_ct'].value"
          [disabled]="true || disabled"
          [dataFormatString]="'datetimeFormat'"
          (handleChange)="handleInputChange('ngay_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex flex-1">
          <app-input-custom-v2
            [label]="getLabel('lbl_nguoi_nhan')"
            class="flex-1"
            #input2
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            name="ong_ba"
            (handleChange)="handleInputChange('ong_ba', $event)"
            [value]="f['ong_ba'].value"
            [invalid]="
              submitted && f['ong_ba'].errors != null
            "></app-input-custom-v2>
        </div>
        <div class="flex flex-1">
          <app-input-custom-v2
            [label]="getLabel('lbl_ly_do_chi')"
            class="flex-1"
            #input2
            [disabled]="disabled"
            (handleEnter)="onEnter($event)"
            name="ten_kh"
            (handleChange)="handleInputChange('dien_giai', $event)"
            [value]="f['dien_giai'].value"
            [invalid]="
              submitted && f['dien_giai'].errors != null
            "></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_hinh_thuc')"
          [options]="paymentList"
          optionDes="ten_thanhtoan"
          optionValue="ma_thanhtoan"
          [isDisable]="disabled"
          [value]="data.masterInfo.ma_thanhtoan"
          (handleChangeValue)="handleChangePayment($event)" />
        <app-input-custom-v2
          *ngIf="
            data.masterInfo.ma_thanhtoan &&
            data.masterInfo.ma_thanhtoan.trim() != 'TM'
          "
          class="flex-1"
          [label]="getLabel('lbl_tai_khoan')"
          #ten_nh
          name="ten_nh"
          [disabled]="disabled"
          [readonly]="true"
          [value]="data.masterInfo.ten_nh"
          (handleChangeLookup)="handleInputLookupChange($event)"
          (handleEnter)="onEnter($event)"
          [control]="bankingService"
          [lookup]="true || disabled"
          [reference]="[tknh, ten_nh]"></app-input-custom-v2>
        <app-input-custom-v2
          class="flex-1 hidden"
          [label]="'Tài khoản ngân hàng'"
          #tknh
          name="tknh"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ma_cp')"
            #ma_phi
            name="ma_phi"
            [disabled]="disabled"
            [value]="fee.ma_phi"
            (handleChangeLookup)="handleInputLookupChangeFee($event)"
            (handleEnter)="onEnter($event)"
            [control]="feeService"
            [lookup]="true || disabled"
            [reference]="[ma_phi, ten_phi, tk_cp]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_cp')"
            #ten_phi
            name="ten_phi"
            [value]="fee.ten_phi"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
        <div class="hidden">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_tk_cp')"
            #tk_cp
            name="tk_cp"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ghi_chu')"
            [value]="ghi_chu"
            (handleChange)="this.ghi_chu = $event"
            name="ghi_chu"
            type="text"
            [disabled]="disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2 *ngIf="data.masterInfo.fcode3?.trim()?.toUpperCase() !== 'THUONGNONG'"
            class="flex-1"
            [label]="getLabel('lbl_so_tien')"
            name="tien"
            [value]="tien"
            [dataFormatString]="'normalQuantity'"
            type="number"
            [align]="'right'"
            (handleChange)="this.tien = $event"
            [action]="true"
            (handleAction)="onEnterItem()"
            (handleEnter)="onEnterItem()"
            [disabled]="disabled"></app-input-custom-v2>
        </div>
      </div>

      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="'Số đơn hàng bán'"
          class="flex-1"
          name="sale_so_ct"
          [disabled]="true"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="sale_so_ct"
          ></app-input-custom-v2>
        <app-input-custom-v2
          [label]="'Mã KH mua'"
          class="flex-1"
          name="sale_ma_kh"
          type="text"
          [value]="sale_ma_kh"
          [disabled]="true"
          ></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <app-input-custom-v2
          [label]="'Ngày đơn hàng bán'"
          class="flex-1"
          type="date"
          name="sale_ngay_ct"
          type="text"
          [value]="sale_ngay_ct"
          [disabled]="true"
          [dataFormatString]="'datetimeFormat'"
          ></app-input-custom-v2>
        </div>        
        <div class="flex-1">&nbsp;</div>
      </div>

    </div>

    <tabs-custom class="pt-2">
      <tab-custom label="Chi tiết" class="h-80 w-full">
        <app-grid-v2
          [fields]="fields"
          [dataSource]="dataSource"
          [isLockingColumn]="isLockingColumn"
          [gridType]="gridType"
          [buttons]="buttons"
          [actionButtons]="actionButtons"
          [disabled]="disabled"
          (handlePaging)="onPageChange($event)"
          (handleSelectColumn)="onSelectColumn($event)"
          (handleActionButton)="onHandleActionButton($event)"
          (handleSortColumn)="onSortColumn($event)"
          (handleSearch)="onSearch()"
          class="h-full w-full">
        </app-grid-v2>
      </tab-custom>
      <tab-custom label="Thuế đầu vào" class="h-80 w-full">
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 px-0 md:px-2 gap-x-10 gap-y-3 pb-2">
          <div class="flex gap-2">
            <app-input-custom-v2
              #so_ct0
              [label]="getLabel('lbl_so_ct0')"
              class="flex-1"
              name="so_ct0"
              [disabled]="disabled"
              [dataFormatString]="'upperCaseFormat'"
              type="text"
              [value]="extend.so_ct0"
              (handleChange)="extend.so_ct0 = $event"
              (handleEnter)="onEnter($event)"></app-input-custom-v2>
            <app-input-custom-v2
              #so_seri0
              [label]="getLabel('lbl_so_seri0')"
              class="flex-1"
              name="so_seri0"
              [disabled]="disabled"
              [dataFormatString]="'upperCaseFormat'"
              type="text"
              [value]="extend.so_seri0"
              (handleChange)="extend.so_seri0 = $event"
              (handleEnter)="onEnter($event)"></app-input-custom-v2>
            <app-input-custom-v2
              [label]="getLabel('lbl_ngay_ct0')"
              class="flex-1"
              type="date"
              name="ngay_ct0"
              type="date"
              [value]="extend.ngay_ct0"
              [dataFormatString]="'datetimeFormat'"
              (handleChange)="extend.ngay_ct0 = $event"
              (handleEnter)="onEnter($event)"></app-input-custom-v2>
          </div>
          <div class="flex">
            <div class="flex flex-1">
              <app-input-custom-v2
                [label]="getLabel('lbl_ten_vt_dv')"
                class="flex-1"
                #ten_vt0
                [disabled]="disabled"
                (handleEnter)="onEnter($event)"
                name="ten_vt"
                (handleChange)="extend.ten_vt = $event"
                [value]="extend.ten_vt"></app-input-custom-v2>
            </div>
          </div>
          <div class="flex gap-2">
            <div class="flex basis-1/3">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_ma_ncc')"
                #ma_ncc0
                name="ma_kh"
                [disabled]="disabled"
                [value]="extend.ma_kh"
                [invalid]="submitted && f['ma_kh'].errors != null"
                (handleChangeLookup)="handleInputLookupChangeExtend($event)"
                (handleEnter)="onEnter($event)"
                [control]="customerService"
                [lookup]="true || disabled"
                [reference]="[
                  ma_ncc0,
                  ten_ncc0,
                  dia_chi0,
                  ma_so_thue0
                ]"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_ten_ncc')"
                #ten_ncc0
                name="ten_kh"
                [value]="extend.ten_kh"
                [disabled]="true || disabled"></app-input-custom-v2>
            </div>
          </div>
          <div class="flex gap-2">
            <div class="flex-1">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_tien')"
                name="t_tien_nt"
                [value]="extend.t_tien_nt || ''"
                [dataFormatString]="'normalQuantity'"
                type="number"
                [align]="'right'"
                (handleChange)="changePriceExtend($event)"
                [disabled]="disabled"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_ma_thue')"
                #ma_thue0
                name="ma_thue"
                [value]="extend.ma_thue || ''"
                (handleChange)="extend.ma_thue = $event"
                [disabled]="disabled"
                (handleEnter)="onEnter($event)"
                [control]="taxService"
                (handleChangeLookup)="changeTax($event)"
                [lookup]="true || disabled"
                [reference]="[ma_thue0, thue_suat0]"></app-input-custom-v2>
            </div>
          </div>
          <div class="flex gap-2">
            <div class="flex-1">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_thue_suat')"
                name="thue_suat"
                #thue_suat0
                [dataFormatString]="'normalQuantity'"
                type="number"
                [value]="extend.thue_suat || ''"
                (handleChange)="extend.thue_suat = $event"
                [disabled]="disabled"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_thue')"
                name="t_thue_nt"
                [value]="extend.t_thue_nt || ''"
                [dataFormatString]="'normalQuantity'"
                type="number"
                [align]="'right'"
                (handleChange)="extend.t_thue_nt = $event"
                [disabled]="disabled"></app-input-custom-v2>
            </div>
          </div>

          <div class="flex gap-2">
            <div class="flex basis-1/3">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_ma_so_thue')"
                #ma_so_thue0
                name="ma_so_thue"
                [disabled]="disabled"
                [value]="extend.ma_so_thue"
                (handleChange)="
                  extend.ma_so_thue = $event; changeTaxCode($event)
                "
                (handleEnter)="onEnter($event)"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                class="flex-1"
                [label]="getLabel('lbl_dia_chi')"
                #dia_chi0
                name="dia_chi"
                [disabled]="disabled"
                (handleEnter)="onEnter($event)"
                (handleChange)="extend.dia_chi = $event"
                [value]="extend.dia_chi"></app-input-custom-v2>
            </div>
          </div>
        </div>
      </tab-custom>
    </tabs-custom>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-1 lg:gap-x-10 gap-y-1 lg:gap-y-3">
      <div class="hidden lg:flex"></div>
      <div class="flex">
        <app-input-custom-v2
          [label]="getLabel('lbl_t_tien')"
          class="flex-1"
          name="t_tien_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_tien_nt"></app-input-custom-v2>
      </div>
      <div class="flex">
        <app-input-custom-v2
          [label]="getLabel('lbl_t_thue')"
          class="flex-1"
          name="t_thue_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_thue_nt"></app-input-custom-v2>
      </div>
      <div class="flex">
        <app-input-custom-v2
          [label]="getLabel('lbl_t_tien_tt')"
          class="flex-1"
          name="t_tt_nt"
          [disabled]="true || disabled"
          [dataFormatString]="'normalQuantity'"
          type="number"
          [align]="'right'"
          [value]="data.masterInfo.t_tt_nt"></app-input-custom-v2>
      </div>
    </div>
    <div class="pb-4 border-b-0.5 border-solid border-gray-300"></div>
    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex">
        <!-- <app-voucher-info
          *ngIf="this.mode != 0"
          [entity]="entity"
          class="text-base"
          [voucherId]="data.masterInfo.stt_rec || ''" /> -->
        <div
          *ngIf="this.submitButtonTitle !== ''"
          #btnSubmit
          type="submit"
          (click)="!disabled && onSubmit()"
          class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm mr-1"></span>
          {{ submitButtonTitle }}
        </div>
        <div
          (click)="onCancel()"
          form=""
          class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300">
          {{ cancelButtonTitle }}
        </div>
      </div>
    </div>
  </form>
  <div
    *ngIf="loading"
    class="fixed top-0 left-0 right-0 bottom-0 flex justify-center items-center z-999 bg-semi_transparent">
    <div class="d-flex flex-column text-white">
      <div
        class="spinner-border text-white align-self-center text-lg"
        role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-lg">Đang thực hiện</p>
    </div>
  </div>
</div>
