<div
  class="px-1 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="title-page pb-2 flex justify-between items-center">
    <div class="flex">
      <h5 class="">{{ title }}</h5>
      <app-voucher-info-header
        [entity]="entity"
        [voucherId]="data.masterInfo.stt_rec || ''"
      />
    </div>
    <app-navigation-voucher
      [mode]="this.mode"
      [voucherId]="this.data.masterInfo.stt_rec || ''"
    />
  </div>
  <form action="" [formGroup]="voucherForm" #form>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-3 pb-2">
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="getLabel('lbl_so_ct')"
          class="flex-1"
          name="so_ct"
          [disabled]="true || disabled"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="f['so_ct'].value"
          (handleChange)="handleInputChange('so_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2>

          <app-input-custom-v2
          [label]="getLabel('lbl_ngay_ct')"
          [readonly]="true"
          [disabled]="true || disabled"
          class="flex-1"
          type="date"
          name="ngay_ct"
          type="text"
          [value]="f['ngay_ct'].value"
          [dataFormatString]="'datetimeFormat'"
          (handleChange)="handleInputChange('ngay_ct', $event)"
          (handleEnter)="onEnter($event)"></app-input-custom-v2> 

        <!-- <div class="flex-1 form-type-date">
            <label class="col-form-label" for="ngay_kt">{{ getLabel('lbl_ngay_ct') }}</label>
            <app-input-date #ngay_ct
              id="ngay_ct"
              [text]="f['ngay_ct'].value"
              (handleBlur)="onBlurVoucherDate($event, ngay_ct)"
              (handleKeyUp)="onKeyupEnter($event, dia_chi)"
            ></app-input-date>
            <span
              *ngIf="!f['ngay_ct'].value"
              style="font-size: 12px; color: #dc3545"
              >Chưa nhập thông tin ngày kết thúc</span
            >
        </div> -->

      </div>
      <div class="flex gap-2">
        <div class="flex basis-1/3">
          <app-input-custom-v2
            class="flex-1"
            [label]="label.ma_kh"
            #ma_kh
            name="ma_kh"
            [value]="f['ma_kh'].value"
            [invalid]="submitted && f['ma_kh'].errors != null"
            (handleChangeLookup)="handleInputLookupChange($event)"
            (handleEnter)="onEnter($event);"
            [control]="customerService"
            [lookup]="true || disabled"
            [reference]="[ma_kh, ten_kh]"></app-input-custom-v2>
        </div>
        <div class="flex-1">
          <app-input-custom-v2
            class="flex-1"
            [label]="getLabel('lbl_ten_kh')"
            #ten_kh
            name="ten_kh"
            [value]="this.data.masterInfo['ten_kh']"
            [disabled]="true || disabled"></app-input-custom-v2>
        </div>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="label.ly_do_hoan"
          class="flex-1"
          #ly_do_hoan
          [disabled]="disabled"
          name="ly_do_hoan"
          [value]="data.masterInfo.ly_do_hoan"
          (handleChange)="this.f['ly_do_hoan'].setValue($event); data.masterInfo.ly_do_hoan = $event;"
          [invalid]="
            submitted && f['ly_do_hoan'].errors != null
          "
          ></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <select-custom
          class="flex-1"
          [label]="getLabel('lbl_trang_thai')"
          [options]="statusList"
          optionDes="statusname"
          optionValue="status"
          [isDisable]="disabled"
          [value]="data.masterInfo.status"
          (handleChangeValue)="data.masterInfo.status = $event" />

        <app-input-custom-v2
            [label]="'Ngày duyệt'"
            [readonly]="true"
            [disabled]="true || disabled"
            class="flex-1"
            type="date"
            name="ngay_duyet"
            type="text"
            [value]="data.masterInfo.ngay_duyet"
            [dataFormatString]="'datetimeFormat'"></app-input-custom-v2> 
      </div>  
      
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="label.dien_giai"
          class="flex-1"
          #dien_giai
          [disabled]="disabled"
          name="dien_giai"
          [value]="data.masterInfo.dien_giai"
          (handleChange)="this.f['dien_giai'].setValue($event); data.masterInfo.dien_giai = $event; validRefundDescription();"
          [invalid]="
            submitted && f['dien_giai'].errors != null
          "></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <form-input-custom #ma_ft
          class="flex-1"
          [lookupIconAsButton]="false"
          [name]="'ma_ft'"
          [label]="label.ma_ft"
          [value]="this.data.masterInfo['ma_ft']"
          [readonly]="true"
          [disabled]="disabled"
          [invalid]="submitted && f['ma_ft'].errors != null"
          (handleClickOpenDialog)="openSearchGetFTCodeDialog($event)" />
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          #so_ct
          [label]="'Số c.từ thanh toán'"
          class="flex-1"
          name="so_ct_tt"
          [disabled]="true"
          [dataFormatString]="'upperCaseFormat'"
          type="text"
          [value]="data.masterInfo.so_ct_tt"></app-input-custom-v2>

        <app-input-custom-v2
          [label]="'Ngày c.từ thanh toán'"
          [readonly]="true"
          [disabled]="true"
          class="flex-1"
          type="date"
          name="ngay_ct_tt"
          type="text"
          [value]="data.masterInfo.ngay_ct_tt"
          [dataFormatString]="'datetimeFormat'"></app-input-custom-v2> 
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2 #tien_thanh_toan
            class="flex-1"
            [label]="'Tiền thanh toán QR'"
            name="tien_thanh_toan"
            [value]="tien_tt_qr"
            [dataFormatString]="'normalQuantity'"
            type="number"
            [align]="'right'"
            [disabled]="true"
            [action]="false"
            ></app-input-custom-v2>
        <app-input-custom-v2 #tong_tien_hoan
            class="flex-1"
            [label]="'Tổng tiền đã hoàn'"
            name="tien_da_hoan"
            [value]="tien_da_hoan"
            [dataFormatString]="'normalQuantity'"
            type="number"
            [align]="'right'"
            [disabled]="true"
            [action]="false"
            ></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2 #tong_tien_hoan
            class="flex-1"
            [label]="'Số tiền có thể hoàn'"
            name="tien_con_lai"
            [value]="tien_con_lai"
            [dataFormatString]="'normalQuantity'"
            type="number"
            [align]="'right'"
            [disabled]="true"
            [action]="false"
            ></app-input-custom-v2>
        <app-input-custom-v2 #so_tien
            class="flex-1"
            [label]="label.tien_hoan"
            name="tien"
            [value]="tien"
            [dataFormatString]="'normalQuantity'"
            type="number"
            [align]="'right'"
            (handleChange)="this.tien = $event"
            [invalid]="submitted && f['tien'].errors != null"
            [action]="false"
            (handleAction)="false && onEnterItem()"
            (handleEnter)="onEnterItem()"
            [disabled]="disabled"></app-input-custom-v2>
      </div>
      
      <div class="flex gap-2">
        <app-input-custom-v2
          #ten_ct
          [label]="'Tên c.từ thanh toán'"
          class="flex-1"
          name="ten_ct_tt"
          [disabled]="true"
          type="text"
          [value]="data.masterInfo.ten_ct_tt"></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="'Lý do hủy'"
          class="flex-1"
          #input2
          [disabled]="true"
          name="ly_do_huy"
          [value]="data.masterInfo.ly_do_huy"
          ></app-input-custom-v2>
      </div>
      <div class="flex gap-2">
        <app-input-custom-v2
          [label]="'Ngày hủy'"
          [readonly]="true"
          [disabled]="true"
          class="flex-1"
          type="date"
          name="ngay_huy"
          type="text"
          [value]="data.masterInfo.ngay_huy"
          [dataFormatString]="'datetimeFormat'"></app-input-custom-v2> 
        <div class="flex-1">&nbsp;</div>
      </div>
    </div>

    <div class="pb-4 border-b-0.5 border-solid border-gray-300"></div>
    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex w-100 justify-content-between gap-2 m-3">
        <app-navigation-voucher
          [mode]="this.mode"
          [voucherId]="this.data.masterInfo.stt_rec || ''"
        />
        <div class="d-flex gap-2 ms-auto">
          <!-- <app-voucher-info
            *ngIf="this.mode != 0"
            [entity]="entity"
            class="text-base"
            [voucherId]="data.masterInfo.stt_rec || ''" /> -->
          <button class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300"
            *ngIf="submitButtonTitle !== '' && !readonly"
            #btnSubmit
            type="button"
            [disabled]="isDisabled"
            (click)="!disabled && onSubmit()">
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"></span>
            {{ submitButtonTitle }}
          </button>
          <div
            (click)="onCancel()"
            form=""
            class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300">
            {{ cancelButtonTitle }}
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
