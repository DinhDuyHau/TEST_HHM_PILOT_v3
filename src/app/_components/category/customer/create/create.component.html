<div
  class="p-0 lg:px-5 lg:mx-5 lg:my-4 lg:py-1 content bg-white ticket-container">
  <div class="pb-1 text-lg">{{ title }}</div>
  <div #form>
    <div
      class="grid grid-cols-1 lg:grid-cols-3 md:grid-cols-2 gap-x-10 gap-y-1 lg:gap-y-2 pb-2 px-2 lg:px-0">
      <div>
        <app-input-custom-v2
          [label]="this.label.ma_kh"
          class="flex-1"
          [disabled]="disabled_ma_kh"
          (handleEnter)="onEnter($event)"
          name="ma_kh"
          [invalid]="submitted && checkInvalid('ma_kh')"
          (handleChange)="customer.ma_kh = $event"
          [value]="customer.ma_kh"></app-input-custom-v2>
      </div>
      <div>
        <app-input-custom-v2
          [label]="this.label.ten_kh"
          class="flex-1"
          [disabled]="disabled_ma_kh"
          (handleEnter)="onEnter($event)"
          name="ten_kh"
          [invalid]="submitted && checkInvalid('ten_kh')"
          (handleChange)="customer.ten_kh = $event"
          [value]="customer.ten_kh"></app-input-custom-v2>
      </div>
      <div>
        <app-input-custom-v2
          [label]="'Tên khác'"
          class="flex-1"
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="ten_kh2"
          (handleChange)="customer.ten_kh2 = $event"
          [value]="customer.ten_kh2"></app-input-custom-v2>
      </div>
      <div>
        <app-input-custom-v2
          [label]="'Mã số thuế'"
          class="flex-1"
          [disabled]="disabled"
          (handleEnter)="onEnter($event); handleChangeTaxCode()"
          name="ma_so_thue"
          (handleChange)="customer.ma_so_thue = $event"
          [value]="customer.ma_so_thue"></app-input-custom-v2>
      </div>
      <div>
        <app-input-custom-v2
          [label]="this.label.address"
          class="flex-1"
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="dia_chi"
          (handleChange)="customer.dia_chi = $event"
          [value]="customer.dia_chi"></app-input-custom-v2>
      </div>
      <div>
        <app-input-custom-v2
          [label]="this.label.sdt"
          class="flex-1"
          [disabled]="disabled"
          (handleEnter)="onEnter($event)"
          name="dien_thoai"
          (handleChange)="customer.dien_thoai = $event"
          [value]="customer.dien_thoai"></app-input-custom-v2>
      </div>
    </div>
    <tabs-custom class="">
      <tab-custom label="Thông tin cá nhân" class="h-80 w-full">
        <div
          class="grid grid-cols-1 lg:grid-cols-2 md:grid-cols-2 gap-x-10 gap-y-1 lg:gap-y-1 pb-2 px-2 lg:px-0">
          <div>
            <app-input-custom-v2
              [label]="this.label.birthday"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="ngay_sinh"
              type="date"
              dataFormatString="datetimeFormat"
              (handleChange)="customer.ngay_sinh = $event"
              [value]="customer.ngay_sinh"></app-input-custom-v2>
          </div>
          <div>
            <app-input-custom-v2
              [label]="'Độ tuổi'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="do_tuoi"
              [dataFormatString]="'normalQuantity'"
              type="number"
              [align]="'right'"
              (handleChange)="customer.do_tuoi = $event"
              [value]="customer.do_tuoi"></app-input-custom-v2>
          </div>
          <div>
            <!-- <app-input-custom-v2
              [label]="'Giới tính'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="gioi_tinh"
              (handleChange)="customer.gioi_tinh = $event"
              [value]="customer.gioi_tinh"></app-input-custom-v2> -->

            <select-custom
              class="flex-1"
              label="Giới tính"
              [options]="optionGender"
              optionDes="gender"
              optionValue="gender"
              [isDisable]="disabled"
              [value]="customer.gioi_tinh"
              (handleChangeValue)="customer.gioi_tinh = $event" />
          </div>
          <div>
            <app-input-custom-v2
              [label]="this.label.email"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="email_cn"
              (handleChange)="customer.email_cn = $event"
              [value]="customer.email_cn"></app-input-custom-v2>
          </div>
        </div>
        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-1 lg:gap-y-1 pb-2 px-2 lg:px-0">
          <div class="flex gap-2">
            <div class="flex basis-1/3">
              <app-input-custom-v2
                [label]="'Mã tỉnh'"
                class="flex-1"
                [disabled]="disabled"
                (handleEnter)="onEnter($event)"
                name="ma_tinh"
                (handleChangeLookup)="onChangeLookupValue($event)"
                [value]="customer.ma_tinh"
                [lookup]="true || disabled"
                control="dmtinhthanh"
                [reference]="['ma_tinh', 'ten_tinh']"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                [label]="'Tên tỉnh'"
                class="flex-1"
                [disabled]="true"
                name="ten_tinh"
                [value]="customer['ten_tinh']"></app-input-custom-v2>
            </div>
          </div>
          <div class="flex gap-2">
            <div class="flex basis-1/3">
              <app-input-custom-v2
                [label]="'Mã quận/huyện'"
                class="flex-1"
                [disabled]="disabled"
                (handleEnter)="onEnter($event)"
                name="ma_quan"
                (handleChangeLookup)="onChangeLookupValue($event)"
                [value]="customer.ma_quan"
                [lookup]="true || disabled"
                control="dmquanhuyen"
                [filter]="[
                  {
                    name: 'ma_tinh',
                    operator: '=',
                    value: customer['ma_tinh']
                  }
                ]"
                [reference]="['ma_quan', 'ten_quan']"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                [label]="'Tên quận/huyện'"
                class="flex-1"
                [disabled]="true"
                name="ten_quan"
                [value]="customer['ten_quan']"></app-input-custom-v2>
            </div>
          </div>
          <div class="flex gap-2">
            <div class="flex basis-1/3">
              <app-input-custom-v2
                [label]="'Mã phường/xã'"
                class="flex-1"
                [disabled]="disabled"
                (handleEnter)="onEnter($event)"
                name="ma_phuong"
                (handleChangeLookup)="onChangeLookupValue($event)"
                [value]="customer.ma_phuong"
                [lookup]="true || disabled"
                control="dmphuongxa"
                [filter]="[
                  {
                    name: 'ma_tinh',
                    operator: '=',
                    value: customer['ma_tinh']
                  },
                  {
                    name: 'ma_quan',
                    operator: '=',
                    value: customer['ma_quan']
                  }
                ]"
                [reference]="['ma_phuong', 'ten_phuong']"></app-input-custom-v2>
            </div>
            <div class="flex-1">
              <app-input-custom-v2
                [label]="'Tên phường'"
                class="flex-1"
                [disabled]="true"
                name="ten_phuong"
                [value]="customer['ten_phuong']"></app-input-custom-v2>
            </div>
          </div>
        </div>
      </tab-custom>
      <tab-custom label="Thông tin xuất hóa đơn" class="h-72 w-full">
        <div
          class="grid grid-cols-1 lg:grid-cols-3 md:grid-cols-2 gap-x-10 gap-y-1 lg:gap-y-2 pb-2 px-2 lg:px-0">
          <div>
            <app-input-custom-v2
              [label]="'Mã số thuế'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event); handleChangeTaxCodeInvoice()"
              name="hoadon_mst"
              (handleChange)="customer.hoadon_mst = $event"
              [value]="customer.hoadon_mst"></app-input-custom-v2>
          </div>
          <div>
            <app-input-custom-v2
              [label]="'Tên đơn vị'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="hoadon_tenkh"
              (handleChange)="customer.hoadon_tenkh = $event"
              [value]="customer.hoadon_tenkh"></app-input-custom-v2>
          </div>
          <div>
            <app-input-custom-v2
              [label]="'Địa chỉ'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="hoadon_diachi"
              (handleChange)="customer.hoadon_diachi = $event"
              [value]="customer.hoadon_diachi"></app-input-custom-v2>
          </div>
          <div>
            <app-input-custom-v2
              [label]="'Hòm thư email'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="hoadon_email"
              (handleChange)="customer.hoadon_email = $event"
              [value]="customer.hoadon_email"></app-input-custom-v2>
          </div>
        </div>
      </tab-custom>
      <tab-custom label="Thông tin ngân hàng" class="h-72 w-full">
        <div
          class="grid grid-cols-1 lg:grid-cols-3 md:grid-cols-2 gap-x-10 gap-y-1 lg:gap-y-2 pb-2 px-2 lg:px-0">
          <div>
            <app-input-custom-v2
              [label]="'Tài khoản ngân hàng'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="tk_nh"
              (handleChange)="customer.tk_nh = $event"
              [value]="customer.tk_nh"></app-input-custom-v2>
          </div>
          <div>
            <app-input-custom-v2
              [label]="'Tên ngân hàng'"
              class="flex-1"
              [disabled]="disabled"
              (handleEnter)="onEnter($event)"
              name="ngan_hang"
              (handleChange)="customer.ngan_hang = $event"
              [value]="customer.ngan_hang"></app-input-custom-v2>
          </div>
        </div>
      </tab-custom>
    </tabs-custom>

    <div class="pb-4 border-b-0.5 border-solid border-gray-300"></div>
    <div class="px-4 py-2 flex flex-1 justify-end">
      <div class="flex">
        <!-- <div
          *ngIf="this.submitButtonTitle !== ''"
          #btnSubmit
          type="button"
          (click)="!disabled && onSubmit()"
          class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm mr-1"></span>
          {{ submitButtonTitle }}
        </div> -->
        <button class="submit px-4 py-1 text-white rounded min-w-button min-h-button bg-primary02_color hover:bg-primary01_color flex items-center justify-center border-0.5 border-solid border-gray-300"
          *ngIf="submitButtonTitle !== '' && !readonly"
          #btnSubmit
          type="button"
          [disabled]="isDisabled"
          (click)="!disabled && onSubmit()">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm mr-1"></span>
          {{ submitButtonTitle }}
        </button>
        <div
          (click)="onCancel()"
          form=""
          class="px-4 ml-2 rounded min-w-button min-h-button bg-neutrals08_color hover:bg-slate-200 py-1 flex items-center justify-center border-0.5 border-solid border-gray-300 cursor-pointer">
          {{ cancelButtonTitle }}
        </div>
      </div>
    </div>
  </div>
</div>
