<div class="p-0 lg:mx-5 lg:my-4 lg:px-9 bg-white">
  <app-grid-v2
    [titleGrid]="title"
    [fields]="fields"
    [gridType]="4"
    [dataSource]="dataSource"
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageCount]="pageCount"
    [pageSizeOptions]="pageSizeOptions"
    [isLockingColumn]="isLockingColumn"
    [buttons]="buttonsCustom"
    [actionButtons]="customer_action_buttons"
    (handlePaging)="onPageChange($event)"
    (handleActionButton)="onClickActionButton($event)"
    (handleChangeCheckbox)="onCheckboxListChanged($event)"
    (handleSelectColumn)="onSelectColumn($event)"
    (handleSortColumn)="onSortColumn($event)"
    (handleSearch)="onSearch()"
    (handleButton)="onClickButton($event)"
    class="flex-1">
  </app-grid-v2>
</div>
<!-- (handleSortColumn)="onSortColumn($event)" -->
