<div class="relative w-full max-w-sm mx-auto">
  <div class="overflow-hidden">
    <div class="flex transition-transform duration-300 ease-in-out"
      [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
      <div *ngFor="let qr of visibleQrList" class="w-full flex-shrink-0 flex flex-col justify-center items-center relative">

        <div [ngClass]="{
            'opacity-40 blur-[1px]': qr.status !== 'pending'
          }">
          <qrcode
            [qrdata]="qr.qrText"
            [width]="256"
            [errorCorrectionLevel]="'M'"
            [title]="'QR Code Thanh Toán'">
          </qrcode>
        </div>

        <div class="text-base">
          Tiền: {{ qr.tien | formatData : 'number' : 'normalPrice' }}
        </div>

        <div *ngIf="qr.status !== 'pending'" class="absolute inset-0 flex items-center justify-center">
          <div class="bg-white text-red-600 text-sm font-semibold px-3 py-1 rounded shadow">
            QR đã hết hạn
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dots -->
  <div class="flex justify-center mt-2 mb-2 space-x-4">
    <div
      *ngFor="let qr of visibleQrList; let i = index"
      class="cursor-pointer select-none transition-all duration-200"
      (click)="currentSlide = i"
      [attr.title]="
        qr.status === 'success' ? 'Đã thanh toán' :
        qr.status === 'fail' ? 'Thanh toán thất bại' : 'Chưa thanh toán'"
    >
      <div
        class="w-5 h-5 rounded-full transition-all duration-200"
        [ngClass]="{
          'bg-gray-400': qr.status === 'pending',
          'bg-green-500': qr.status === 'success',
          'bg-red-500': qr.status === 'fail',
          'border border-light': currentSlide === i,
          'border border-4 border-light': currentSlide !== i
        }"
      ></div>
    </div>
  </div>

</div>
