<div class="h-full bg-white p-4">
  <div class="justify-between pb-2">
    <div class="text-neutrals02_color font-medium text-xl">
      Chỉ số bán hàng trong tháng {{ this.month }}
    </div>
  </div>

  <div class="overflow-x-auto overflow-y-auto max-h-96 relative h-full border border-gray-300 border-l-0 border-r-0">
    <table class="w-full h-full">
      <!-- Header -->
      <thead class="bg-gray-200 sticky top-0 z-20 shadow-md">
        <tr>
          <th class="border border-gray-300 border-t-0 px-4 py-2 text-left font-medium">TT</th>
          <th class="border border-gray-300 border-t-0 px-4 py-2 text-left font-medium">Tên nhóm hàng</th>
          <th class="border border-gray-300 border-t-0 px-4 py-2 text-left font-medium">DS bán</th>
          <th class="border border-gray-300 border-t-0 px-4 py-2 text-left font-medium">SL bán</th>
          <th class="border border-gray-300 border-t-0 px-4 py-2 text-left font-medium">SL hcare bán</th>
          <th class="border border-gray-300 border-t-0 px-4 py-2 text-left font-medium">SL bán hôm nay</th>
        </tr>
      </thead>
      <!-- Body -->
      <tbody>
        <tr *ngFor="let item of data" class="hover:bg-gray-100">
          <td class="border border-gray-300 border-b-0 px-4 py-2 text-center">{{ item.stt }}</td>
          <td class="border border-gray-300 border-b-0 px-4 py-2">{{ item.ten_nh }}</td>
          <td class="border border-gray-300 border-b-0 px-4 py-2 text-right">{{ formatNumber(item.ds_ban) }}</td>
          <td class="border border-gray-300 border-b-0 px-4 py-2 text-right">{{ formatNumber(item.sl_ban) }}</td>
          <td class="border border-gray-300 border-b-0 px-4 py-2 text-right">{{ formatNumber(item.sl_hcare_ban) }}</td>
          <td class="border border-gray-300 border-b-0 px-4 py-2 text-right">{{ formatNumber(item.sl_ban_hn) }}</td>
        </tr>
        <!-- Trường hợp chưa có dữ liệu -->
        <tr *ngIf="!data || data.length === 0">
          <td colspan="7" class="border border-gray-300 border-b-0 px-4 py-2 text-center">
            <p class="txt-no-record">Chưa có dữ liệu</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
