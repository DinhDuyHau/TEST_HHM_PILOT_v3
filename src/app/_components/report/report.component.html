<div class="p-0 lg:mx-5 lg:my-4 lg:px-9 bg-white">
  <app-grid-v2
    [titleGrid]="title"
    [filter_mess]="titleGrid"
    [sysid]="entity"
    [fields]="fields"
    [gridType]="gridType"
    [dataSource]="dataSource"
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageCount]="pageCount"
    [pageSizeOptions]="pageSizeOptions"
    [isLockingColumn]="isLockingColumn"
    [isLoadReport]="isLoadReport"
    [isLoadData]="!isLoadReport"
    [buttons]="buttons"
    (handlePaging)="onPageChange($event)"
    (handleChangeCheckbox)="onCheckboxListChanged($event)"
    (handleSelectColumn)="onSelectColumn($event)"
    (handleSortColumn)="onSortColumn($event)"
    (handleSearch)="onSearch()"
    (handleButton)="onClickButton($event)"
    class="flex-1">
  </app-grid-v2>
</div>
